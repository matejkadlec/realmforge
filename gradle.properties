org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Pinned platform versions. Do not change without an ADR (docs/decisions/).
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.116
# FML major version range for neoforge.mods.toml
loader_version_range=[1,)
junit_version=5.14.4

## Mod properties
# Version format: <mod_version>+mc<minecraft_version>, e.g. 0.1.0+mc26.1.2
mod_version=0.0.1
# The release phase in the welcome message on joining a world, "Welcome to Realmforge v0.0.1 (Alpha)" (RLM-520):
# Alpha until the game is feature-complete, then Beta, then empty from v1.0.0 (no parentheses). Like mod_version, it
# changes only with a release (Matěj, 2026-10-29). neoforge.mods.toml hands it to the mod as the property "phase".
mod_phase=Alpha
mod_group_id=io.github.matejkadlec.realmforge
# The whole mod, imported dungeon rooms included, is All Rights Reserved (see LICENSE, ADR 0067). Both mods read it.
mod_license=All rights reserved. Use in a modpack prohibited.
