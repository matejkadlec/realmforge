# yaml-language-server: $schema=../../tools/schemas/texts.schema.json
# Chat and action bar messages (message.realmforge.<name>).
id: message
texts:
  dark_vision_off:
    en_us: Dark Vision Off
  dark_vision_on:
    en_us: Dark Vision On
  # Leveling (C2, architecture 10.2). XP a kill gave, in the action bar: "+50 XP" (%1$s the XP).
  xp_gained:
    en_us: "+%1$s XP"
  # The title and subtitle a level-up shows (%1$s the new level).
  level_up:
    en_us: Level Up!
  level_up_subtitle:
    en_us: You are now level %1$s
  # In chat when a level-up reaches the cap (%1$s the cap, %2$s the chapter that raises it).
  level_cap_reached:
    en_us: Level %1$s is the cap for now, so you gain no XP until you complete %2$s.
  # In chat when completing a chapter raises the cap (%1$s the chapter, %2$s the new cap).
  level_cap_raised:
    en_us: "%1$s complete! Your level cap is now %2$s."
  # Stat points (RLM-196). After a level-up (%1$s the unspent points, %2$s the character sheet's key).
  stat_points_unspent:
    en_us: "Unspent stat points: %1$s. Press %2$s to spend them on your character sheet."
  # The Scroll of Oblivion returned every spent point (%1$s the unspent points now).
  stat_points_unlearned:
    en_us: "Your stat points are unspent again. Unspent stat points: %1$s."
  # A Scroll of Oblivion used with no point spent: nothing happens, and the item is kept.
  stat_points_none_spent:
    en_us: You have no spent stat points to unlearn.
  # An item refused in combat (the scrolls, RLM-348): used within 10 s of the last hit dealt or taken, it is kept.
  cannot_use_in_combat:
    en_us: You can't use this in combat.
  # A shield taken in hand while a two-handed wand keeps every shield locked (in the main hand, and for 3 minutes
  # after; RLM-172, Matěj, 2026-10-26): it drops to the ground.
  shield_locked:
    en_us: You can't use this now.
  # The level fell below what the spent points need (a command, a revoked chapter), so they all return (%1$s the
  # unspent points now).
  stat_points_returned:
    en_us: "Your level fell, so your stat points are unspent again. Unspent stat points: %1$s."
  # Realms (W2a, realm portal spec "Access and unlocks"). The title a player gets when a portal, a command or a warp
  # would take them into a realm they have not unlocked (Matěj's wording, RLM-128); the realm's hint is the subtitle.
  realm_not_eligible:
    en_us: You are not eligible to pass through the portal.
  # A bed in a realm, which sets no spawn: a player always respawns in Overworld (RLM-128).
  bed_only_overworld:
    en_us: Beds only work in Overworld
  # The realm portal's sealstone (W2b, realm portal spec "The sealstone"), in the action bar. %1$s is a realm's
  # name (no article, RLM-188), Overworld's for a return portal. A signet or the sneak gesture opened the portal:
  realm_portal_opens_onto:
    en_us: The portal opens onto %1$s
  # A signet of the realm the portal already shows.
  realm_portal_already_opens_onto:
    en_us: The portal already opens onto %1$s
  # A signet of a realm the player has not unlocked: %1$s the realm's description ("stone realm"), %2$s its hint
  # (Matěj's wording, 2026-10-20).
  realm_portal_not_eligible:
    en_us: You are not eligible to open a portal to the %1$s. %2$s
  # Any signet on a frame inside a realm: those lead only back to Overworld (Matěj, RLM-188).
  realm_portal_only_back:
    en_us: This portal leads only back to Overworld
  # A signet or the gesture on a frame that is not complete, or whose opening is blocked; particles mark the problems.
  realm_portal_frame_incomplete:
    en_us: The frame is incomplete
  # An empty hand on a dark sealstone, or the sneak gesture that closed it.
  realm_portal_closed:
    en_us: The portal is closed
  # A sealstone in a dimension without a realm entry: the instances, the Nether, the End, other mods' dimensions.
  realm_portal_cannot_open_here:
    en_us: The portal cannot open here
  # A sealstone set to a realm that no longer exists (content removed, a data pack off): it shows this and refuses.
  realm_portal_unknown_realm:
    en_us: The portal opens onto an unknown realm
  # The arrival title's subtitle in a realm (RLM-139, realm portal spec "Arriving"): %1$s its element ("Stone Realm"),
  # %2$s and %3$s its lowest and highest level (the realm entry's `levels`).
  realm_arrival_levels:
    en_us: "%1$s · Levels %2$s–%3$s"
  # Dungeon portals (W4d, RLM-181, architecture 15.5). A key opened a portal (%1$s the dungeon type's name, %2$s the
  # minutes it stays open).
  portal_opening:
    en_us: The portal to %1$s is opening. It stays open for %2$s minutes.
  # The dungeon behind the portal is built (%1$s the dungeon type's name).
  portal_ready:
    en_us: The portal to %1$s is open. Use it to enter.
  # Used while the dungeon behind it is still being built.
  portal_still_opening:
    en_us: The portal is still opening.
  # Used by a player who did not open it: a dungeon is solo (D8).
  portal_not_yours:
    en_us: This portal leads to someone else's dungeon.
  # A closed portal used without a key.
  portal_needs_key:
    en_us: Use a dungeon key on the portal to open it.
  # A key used on a portal that is already open.
  portal_already_open:
    en_us: This portal is already open.
  # A key used on a portal inside a dungeon.
  portal_inside_dungeon:
    en_us: A portal cannot open inside a dungeon.
  # A key used by a player who already has a dungeon.
  portal_dungeon_already_open:
    en_us: You already have a dungeon open. Leave it before you open another.
  # The dungeon could not be planned or built; the key is given back.
  portal_failed:
    en_us: The dungeon could not be built, so your key was returned.
  # Warnings before the portal closes and sends everyone inside back.
  portal_closes_in_5_minutes:
    en_us: The portal closes in 5 minutes.
  portal_closes_in_1_minute:
    en_us: The portal closes in 1 minute.
  portal_closes_in_10_seconds:
    en_us: The portal closes in 10 seconds.
  portal_closed:
    en_us: The portal has closed.
  # The dungeon's goal is done (its final boss died); the portal now closes in 5 minutes (Matěj's wording, RLM-181).
  dungeon_completed:
    en_us: You completed the instance and will be automatically teleported out in 5 minutes. Use '/instance leave' to exit immediately.
  # /instance leave, or the dungeon exit.
  dungeon_left:
    en_us: You left the dungeon.
  not_in_dungeon:
    en_us: You are not in a dungeon.
