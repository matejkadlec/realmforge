# yaml-language-server: $schema=../../tools/schemas/texts.schema.json
# Chat and action bar messages (message.realmforge.<name>).
id: message
texts:
  dark_vision_off:
    en_us: Dark Vision Off
  dark_vision_on:
    en_us: Dark Vision On
  # Leveling (C2, architecture 10.2). XP a kill gave, in the action bar: "+50 XP" (%1$s the XP).
  xp_gained:
    en_us: "+%1$s XP"
  # The title and subtitle a level-up shows (%1$s the new level).
  level_up:
    en_us: Level Up!
  level_up_subtitle:
    en_us: You are now level %1$s
  # In chat when a level-up reaches the cap (%1$s the cap, %2$s the chapter that raises it).
  level_cap_reached:
    en_us: Level %1$s is the cap for now, so you gain no XP until you complete %2$s.
  # In chat when completing a chapter raises the cap (%1$s the chapter, %2$s the new cap).
  level_cap_raised:
    en_us: "%1$s complete! Your level cap is now %2$s."
  # Stat points (RLM-196). After a level-up (%1$s the unspent points, %2$s the character sheet's key).
  stat_points_unspent:
    en_us: "Unspent stat points: %1$s. Press %2$s to spend them on your character sheet."
  # The Scroll of Oblivion returned every spent point (%1$s the unspent points now).
  stat_points_unlearned:
    en_us: "Your stat points are unspent again. Unspent stat points: %1$s."
  # A Scroll of Oblivion used with no point spent: nothing happens, and the item is kept.
  stat_points_none_spent:
    en_us: You have no spent stat points to unlearn.
  # The level fell below what the spent points need (a command, a revoked chapter), so they all return (%1$s the
  # unspent points now).
  stat_points_returned:
    en_us: "Your level fell, so your stat points are unspent again. Unspent stat points: %1$s."
  # Realms (W2a, realm portal spec "Access and unlocks"). The title a player gets when a portal, a command or a warp
  # would take them into a realm they have not unlocked (Matěj's wording, RLM-128); the realm's hint is the subtitle.
  realm_not_eligible:
    en_us: You are not eligible to pass through the portal.
  # A bed in a realm, which sets no spawn: a player always respawns in Overworld (RLM-128).
  bed_only_overworld:
    en_us: Beds only work in Overworld
