# yaml-language-server: $schema=../../tools/schemas/texts.schema.json
# The gem classes of our extra gem bonuses (content/apotheosis_gem_bonuses/, RLM-547, RLM-548). A gem's tooltip lists
# each bonus as "<class>: <bonus>", reading gem_class.<key>, and the pipeline writes our classes with the key
# realmforge.<key>, so their names are gem_class.realmforge.<key>. Apotheosis names its own in the plural ("Core Armor",
# "Lower Armor", "Helmets"); ours follow the robe categories' plurals (loot_category.yaml: Caster Caps, Robes, Pants,
# Sandals).
id: gem_class
texts:
  wand:
    en_us: Wands
  robe_head:
    en_us: Caster Caps
  robe_chest:
    en_us: Caster Robes
  robe_legs:
    en_us: Caster Pants
  robe_feet:
    en_us: Caster Sandals
  # Chest and legs, as Apotheosis's core_armor.
  robe_core:
    en_us: Caster Robes and Pants
  # Legs and feet, as Apotheosis's lower_armor.
  robe_lower:
    en_us: Caster Pants and Sandals
  # All four pieces, as Apotheosis's armor.
  robes:
    en_us: Caster Garb
  # A helmet and the robe head together (Slipstream's head Dodge Chance).
  head:
    en_us: Helmets and Caster Caps
