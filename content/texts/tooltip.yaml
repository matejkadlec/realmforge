# yaml-language-server: $schema=../../tools/schemas/texts.schema.json
# Item tooltip lines the pipeline writes into an item's lore (tooltip.realmforge.<name>, generate/items.py).
id: tooltip
texts:
  # A realm's sigil (W2b, realm portal spec "Realm sigils"): the realm it opens the portal onto, %1$s the realm's name,
  # %2$s its element ("Undervault — Stone Realm", RLM-139).
  sigil_realm:
    en_us: "%1$s — %2$s"
  # A sigil opens any number of portals and is never consumed.
  sigil_never_used_up:
    en_us: Never used up
