# yaml-language-server: $schema=../../tools/schemas/texts.schema.json
# Screen texts (gui.realmforge.<name>): the character sheet (client/screen/CharacterSheetScreen). In the format texts
# %1$s and %2$s are filled in by the game.
id: gui
texts:
  # A boss's bar at the top of the screen (W5a, architecture 14.3): "Astone, the Unbroken — Stone Fury" (%1$s the
  # boss's name, %2$s its phase's name).
  boss_bar_title:
    en_us: "%1$s — %2$s"
  # The screen's title, for the narrator; the sheet itself shows character_title.
  character_sheet:
    en_us: Character Sheet
  # The sheet's heading: "Steve · Lv. 12" (%1$s the player's name, %2$s the level; Matěj, 2026-10-14). Race, class
  # and specialization are on the Origin tab instead, which keeps the heading short.
  character_title:
    en_us: "%1$s · Lv. %2$s"
  # The XP bar above the health and food rows (C2): the character level at its middle (%1$s the level).
  xp_bar_level:
    en_us: Lv. %1$s
  # The tabs, and the sections each shows in its two columns.
  tab_stats:
    en_us: Stats
  tab_combat:
    en_us: Combat
  tab_magic:
    en_us: Magic
  tab_origin:
    en_us: Origin
  primary_stats:
    en_us: Primary Stats
  other_stats:
    en_us: Other
  offense:
    en_us: Offense
  defense:
    en_us: Defense
  spells:
    en_us: Spells
  spell_schools:
    en_us: Spell Schools
  # Vanilla attributes under the names the sheet gives them, on their rows and in the bonuses of the primary
  # stats (Matěj, 2026-10-13 and 2026-10-14).
  mining_speed:
    en_us: Mining Speed
  block_reach:
    en_us: Block Reach
  entity_reach:
    en_us: Entity Reach
  movement_speed:
    en_us: Movement Speed
  swimming_speed:
    en_us: Swimming Speed
  # A bonus a primary stat gives: "+25% Attack Damage" (%1$s the amount, %2$s the attribute).
  stat_bonus:
    en_us: "%1$s %2$s"
  # A milestone of a primary stat: "At 25: +10% Crit Damage" (%1$s the points, %2$s the bonus).
  stat_milestone:
    en_us: "At %1$s: %2$s"
  # Stat points (RLM-196): the unspent points at the end of the Primary Stats title, "Unspent: 3" (%1$s the points;
  # Matěj, 2026-10-16), and the first line of the tooltip on the + beside a primary stat, which spends one point on it
  # (%1$s the stat); the lines below it say what the point gives.
  unspent_stat_points:
    en_us: "Unspent: %1$s"
  spend_stat_point:
    en_us: Spend a point on %1$s
  # Character creation (RLM-22): the screen's title, its two columns, the class's resource and starting kit, and the
  # button that creates the character.
  character_creation:
    en_us: Create Your Character
  race:
    en_us: Race
  class:
    en_us: Class
  # "Resource: Rage" (%1$s the resource's name).
  class_resource:
    en_us: "Resource: %1$s"
  starting_kit:
    en_us: Starting Kit
  # An item of the starting kit that comes more than once: "Bread ×8" (%1$s the item, %2$s the count).
  kit_item:
    en_us: "%1$s ×%2$s"
  create_character:
    en_us: Create Character
  # The Origin tab's sections (Matěj, 2026-10-14): "Race: Human", "Class: Warrior" (%1$s the name, or none), and
  # a placeholder for the specialization until the specialization spell trees exist (C5, RLM-333).
  origin_race:
    en_us: "Race: %1$s"
  origin_class:
    en_us: "Class: %1$s"
  # The heading of the race's racial active under its bonuses (C4, RLM-219), in gold over the spell's name in yellow;
  # the racial passive follows the same way, its name over its tooltip line (Matěj, 2026-10-30).
  origin_racial_ability:
    en_us: Racial Ability
  none:
    en_us: None
  specialization_wip:
    en_us: "Specialization: WIP"
  specialization_wip_description:
    en_us: Lorem ipsum dolor sit amet, consectetur adipiscing elit.
  # The spellbook (C3b, RLM-25, client/screen/SpellbookScreen): the player's known spells and the spell bar's layout.
  spellbook:
    en_us: Spellbook
  known_spells:
    en_us: Known Spells
  spell_bar:
    en_us: Spell Bar
  no_known_spells:
    en_us: You know no spells yet.
  spellbook_hint:
    en_us: Click a spell, then a slot. Right-click a slot to empty it.
  # A known spell in the list: "Test Bolt (Rank 2)" (%1$s the name, %2$s the rank).
  spell_with_rank:
    en_us: "%1$s (Rank %2$s)"
  spell_options:
    en_us: Options
  # The spell casting options (Matěj, 2026-10-19, RLM-25; client/screen/SpellOptionsScreen), also behind the
  # Config button of the mod list. The tooltips are Matěj's (2026-10-29): "Spellbar" is one word, and a tooltip's
  # second case ("Off:", "Hold:") starts on a new line.
  spell_casting_options:
    en_us: Spell Casting Options
  queue_spell_casts:
    en_us: Queue Spell Casts
  queue_spell_casts_tooltip:
    en_us: "On: a spell you press during another spell's cast waits for it to end, and casts afterwards.\nOff: a spell you press during another spell's cast cancels it to cast itself immediately."
  spells_queue_size:
    en_us: Spells Queue Size
  spells_queue_size_tooltip:
    en_us: How many spells can be queued for a subsequent cast.
  # The spell bar's options, rows of the same list (RLM-404; Matěj, 2026-10-29: no section heading). Spellbar
  # Position opens the drag mode (client/screen/SpellBarPositionScreen), whose title it is too.
  spell_bar_position:
    en_us: Spellbar Position
  spell_bar_position_button:
    en_us: Spellbar Position...
  spell_bar_position_tooltip:
    en_us: Reposition the spellbar wherever you want it on the screen.
  spell_bar_position_hint:
    en_us: Drag the bar to change its position.
  spell_bar_size:
    en_us: Spellbar Size
  spell_bar_size_tooltip:
    en_us: Size of the spellbar. The width-to-height ratio stays the same.
  mirror_hotbar_width:
    en_us: Mirror Hotbar's Width
  mirror_hotbar_width_tooltip:
    en_us: "On: the spellbar matches the vanilla hotbar's width. Overrides the Spellbar Size setting."
  # How the Highlight Spell Target key works (RLM-468; Matěj's playtest of 2026-10-29): a row of the same list,
  # "Highlight Spell Target: Toggle" by default, "Hold" on a click.
  highlight_spell_target:
    en_us: Highlight Spell Target
  highlight_spell_target_toggle:
    en_us: Toggle
  highlight_spell_target_hold:
    en_us: Hold
  highlight_spell_target_tooltip:
    en_us: "Toggle: a press of the key bind shows the highlight under the target mob. Press again to hide it.\nHold: shows the highlight under the target mob only while the key bind is held."
  reset_position:
    en_us: Reset Position
  save:
    en_us: Save
  # The arrival title's subtitle in a dungeon run, under the dungeon's name (RLM-409; client/hud/InstanceArrivalTitle).
  instance_subtitle:
    en_us: Realmforge Instance
