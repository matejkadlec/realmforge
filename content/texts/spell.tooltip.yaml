# yaml-language-server: $schema=../../tools/schemas/texts.schema.json
# The lines of a spell's tooltip in the spellbook (spell.tooltip.realmforge.<name>, spell/SpellTooltip), built from
# the spell's data: its rank, cost, range, cast and cooldown; the description below them is the spell's own.
id: spell.tooltip
texts:
  # %1$s the rank, %2$s the highest rank.
  rank:
    en_us: Rank %1$s of %2$s
  # "20 Mana" (%1$s the amount, %2$s the resource's name).
  cost:
    en_us: "%1$s %2$s"
  # A channel's cost, paid as each second of it begins: "15 Mana per sec".
  cost_per_second:
    en_us: "%1$s %2$s per sec"
  # A channel's cost with an amount up front (RLM-572: Blizzard), paid when it begins with its first second's: "40 Mana,
  # then 15 per sec" (%1$s up front, %2$s each second, %3$s the resource's name).
  cost_up_front:
    en_us: "%1$s %3$s, then %2$s per sec"
  # %1$s in blocks.
  range:
    en_us: "%1$s block range"
  # A melee spell's (RLM-399): an enemy in the caster's melee swing, or a hit shape in front of it, which grow with
  # the caster's melee reach.
  melee_range:
    en_us: Melee range
  instant:
    en_us: Instant
  # %1$s in seconds.
  cast_time:
    en_us: "%1$s sec cast"
  channel:
    en_us: Channeled (%1$s sec)
  cooldown:
    en_us: "%1$s sec cooldown"
  # A passive spell's tooltip (RLM-541) in place of its cost, range and cast: it works while it is known.
  passive:
    en_us: Passive
  # An aura spell's tooltip (RLM-595) and its tag in the spellbook: a spell the spell bar turns on and off.
  aura:
    en_us: Aura
  # The cooldown every aura shares (RLM-595), started by turning one on, off or switching; Cooldown Reduction never
  # shortens it. %1$s in minutes.
  aura_cooldown:
    en_us: "%1$s min cooldown, shared by every aura"
  # Above a passive spell's description at its next rank, below the one at its rank.
  next_rank:
    en_us: "Next rank:"
  # The racial slot beside the spell bar, while it is empty (C4 fills it from the race).
  racial_empty:
    en_us: Your racial ability goes here
  # A bar slot without a spell.
  empty_slot:
    en_us: Empty slot
