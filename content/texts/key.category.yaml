# yaml-language-server: $schema=../../tools/schemas/texts.schema.json
# Key category headings in Options > Controls. The game reads a category's name from key.category.<namespace>.<path>,
# so `main` names the category realmforge:main that holds our keys and `spell_bar` realmforge:spell_bar.
id: key.category
texts:
  main:
    en_us: Realmforge
  # The spell bar's keys (C3b, RLM-25).
  spell_bar:
    en_us: Realmforge Spell Bar
