# yaml-language-server: $schema=../../tools/schemas/apotheosis_affixes.schema.json
# Deflective (less damage from projectiles): Apotheosis's damage reduction becomes our Projectile Resistance, an
# attribute the character sheet shows and the damage pipeline applies by damage type tag, to projectiles of every mob
# and mod (Matěj, 2026-10-16, RLM-233). Apotheosis's values, items and rolls stay.
# It gives no armor, so caster robes roll it too (gear design, RLM-557).
id: deflective
affix: apotheosis:armor/dmg_reduction/deflective
replace:
  categories:
    - apotheosis:helmet
    - apotheosis:chestplate
    - realmforge:robe_head
    - realmforge:robe_chest
to_attribute: realmforge:projectile_resistance
