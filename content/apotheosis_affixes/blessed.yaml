# yaml-language-server: $schema=../../tools/schemas/apotheosis_affixes.schema.json
# Blessed (max health) gives no armor, so caster robes roll it too (gear design, RLM-557).
id: blessed
affix: apotheosis:armor/attribute/blessed
replace:
  categories:
    - apotheosis:helmet
    - apotheosis:chestplate
    - apotheosis:leggings
    - apotheosis:boots
    - realmforge:robe_head
    - realmforge:robe_chest
    - realmforge:robe_legs
    - realmforge:robe_feet
