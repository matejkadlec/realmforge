# yaml-language-server: $schema=../../tools/schemas/apotheosis_affixes.schema.json
# Psychic (a blocked projectile deals a share of its damage to the shooter): Matěj's affix review (RLM-232) adds Rare,
# 40-60 %. An ability, so a Rare shield rolls it only through Rare's chanced ability slot.
id: psychic
affix: apotheosis:shield/psychic
replace:
  values:
    apotheosis:rare:
      min: 0.4
      max: 0.6
    apotheosis:epic:
      min: 0.5
      max: 0.9
    apotheosis:mythic:
      min: 0.6
      max: 1.2
