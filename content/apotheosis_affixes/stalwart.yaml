# yaml-language-server: $schema=../../tools/schemas/apotheosis_affixes.schema.json
# Stalwart (knockback resistance) gives no armor, so caster robes roll it too (gear design, RLM-557).
id: stalwart
affix: apotheosis:armor/attribute/stalwart
replace:
  categories:
    - apotheosis:helmet
    - apotheosis:chestplate
    - apotheosis:leggings
    - apotheosis:boots
    - realmforge:robe_head
    - realmforge:robe_chest
    - realmforge:robe_legs
    - realmforge:robe_feet
