# yaml-language-server: $schema=../../tools/schemas/dungeons.schema.json
# The dungeon framework's test type (W4a, RLM-178), test content like realmforge:test_item: a vault of the stone vault
# rooms imported from Stonevaults and the room generator's corridors. Its key opens a dungeon portal to it (W4d,
# RLM-181); `/qa dungeon plan`, `build` and `enter` show its layouts. The real dungeon types come with W6. About 50
# rooms (RLM-363; 70 felt too long in Matěj's second playtest of 2026-10-24): one long main road with a fight after
# every 2 to 4 rooms and a lock, a trap or a sight after every 1 or 2 corridors, and a short branch to treasure every
# 10 or so rooms (his first playtest of 2026-10-24, RLM-364). The open time is a placeholder until balance, and so is
# the level (RLM-459): 10, the end of chapter 1, as this testing dungeon becomes a real one in the Overworld (Matěj,
# 2026-10-27, RLM-36). A run is at least that level, raised to its party's highest, so its other mobs are 7 or 8 for
# a player up to level 10.
id: test_dungeon
name:
  en_us: Test Dungeon
pool: realmforge:stone_vault
layout:
  main_path: [38, 42]
  branches: [3, 4]
  branch_rooms: [2, 3]
  ending: treasure
  pacing:
    corridors: [1, 2]
    fights: [2, 4]
    repeat: 12
  walls:
    block: minecraft:stone_bricks
    weight: 4
key: realmforge:test_dungeon_key
# How many chests and barrels each room keeps (RLM-365): Matěj's target is about 6 containers per 2 spawners, "for
# any room that can generate chest". Treasure rooms take his table; every other room the default, which keeps a
# room's one chest (a lock's reward) and cuts the big ones: about 41 containers to about 14 spawners in a run
# (docs/design/container-loot.md). Rooms with their own table set it in their sidecar.
containers:
  treasure:
    chests: {2: 25, 3: 40, 4: 25, 5: 10}
    barrels: {0: 40, 1: 40, 2: 20}
  default:
    chests: {1: 60, 2: 30, 3: 10}
    barrels: {0: 20, 1: 40, 2: 30, 3: 10}
open_minutes: 60
level: 10
