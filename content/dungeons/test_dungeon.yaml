# yaml-language-server: $schema=../../tools/schemas/dungeons.schema.json
# The dungeon framework's test type (W4a, RLM-178), test content like realmforge:test_item: a vault of the stone vault
# rooms imported from Stonevaults and the room generator's corridors. Its key opens a dungeon portal to it (W4d,
# RLM-181); `/qa dungeon plan`, `build` and `enter` show its layouts. The real dungeon types come with W6. Sized for a
# run of 20 to 30 minutes (RLM-363): about 75 rooms, three to five corridors between fights and treasure (RLM-364). The
# open time is a placeholder until balance.
id: test_dungeon
name:
  en_us: Test Dungeon
pool: realmforge:stone_vault
layout:
  main_path: [26, 32]
  branches: [6, 8]
  branch_rooms: [4, 7]
  ending: treasure
  special_gap: [3, 5]
  walls:
    block: minecraft:stone_bricks
    weight: 4
key: realmforge:test_dungeon_key
open_minutes: 45
