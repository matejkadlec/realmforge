# yaml-language-server: $schema=../../tools/schemas/sounds.schema.json
# The Hewn Sentinel's sounds (W3, RLM-33; Matěj's playtest, 2026-10-23; RLM-621): stone joints and its gem now and
# then, a forceful stone hit when it is hurt, a crush when it breaks apart, heavy stone steps, and its fist's swing.
# Our own sounds from ElevenLabs (ADR 0079), an agent's provisional picks until Matěj listens (RLM-669).
id: hewn_sentinel
category: entity
events:
  ambient:
    subtitle: {en_us: Hewn Sentinel grinds}
    sounds:
      - {file: hewn_sentinel/ambient_1, volume: 0.8}
      - {file: hewn_sentinel/ambient_2, volume: 0.8}
  hurt:
    subtitle: {en_us: Hewn Sentinel cracks}
    sounds:
      - {file: hewn_sentinel/hurt_1}
      - {file: hewn_sentinel/hurt_2}
  death:
    subtitle: {en_us: Hewn Sentinel crumbles}
    sounds:
      - {file: hewn_sentinel/death_1}
  step:
    subtitle: {en_us: Hewn Sentinel stomps}
    sounds:
      - {file: hewn_sentinel/step_1, volume: 0.5}
      - {file: hewn_sentinel/step_2, volume: 0.5}
  attack:
    subtitle: {en_us: Hewn Sentinel swings}
    sounds:
      - {file: hewn_sentinel/attack_1}
