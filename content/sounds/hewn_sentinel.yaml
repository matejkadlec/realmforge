# yaml-language-server: $schema=../../tools/schemas/sounds.schema.json
# The Hewn Sentinel's sounds (W3, RLM-33; Matěj's playtest, 2026-10-23): a forceful stone hit when it is hurt, a crush
# when it breaks apart, and heavy stone steps. Vanilla sounds, deeper, until A3's own (RLM-126).
id: hewn_sentinel
category: entity
events:
  hurt:
    subtitle: {en_us: Hewn Sentinel cracks}
    sounds:
      - {event: minecraft:block.deepslate.break, pitch: 0.8}
      - {event: minecraft:entity.iron_golem.hurt, pitch: 0.7}
  death:
    subtitle: {en_us: Hewn Sentinel crumbles}
    sounds:
      - {event: minecraft:entity.iron_golem.death, pitch: 0.8}
  step:
    subtitle: {en_us: Hewn Sentinel stomps}
    sounds:
      - {event: minecraft:entity.iron_golem.step, pitch: 0.7}
