# yaml-language-server: $schema=../../tools/schemas/sounds.schema.json
# The Hewn Chanter's sounds (W3, RLM-33; RLM-621): its chant of humming stone, a lighter crack when it is hurt, and
# its crumbling as the chant fades. It walks without a sound and casts Stoneform (stoneform.yaml).
# Our own sounds from ElevenLabs (ADR 0079), an agent's provisional picks until Matěj listens (RLM-669).
id: hewn_chanter
category: entity
events:
  ambient:
    subtitle: {en_us: Hewn Chanter hums}
    sounds:
      - {file: hewn_chanter/ambient_1, volume: 0.7}
      - {file: hewn_chanter/ambient_2, volume: 0.7}
  hurt:
    subtitle: {en_us: Hewn Chanter cracks}
    sounds:
      - {file: hewn_chanter/hurt_1}
      - {file: hewn_chanter/hurt_2}
  death:
    subtitle: {en_us: Hewn Chanter crumbles}
    sounds:
      - {file: hewn_chanter/death_1}
