# yaml-language-server: $schema=../../tools/schemas/sounds.schema.json
# Hurled Boulder's sounds (W5b, RLM-491): stone grinding together while the boulder forms in Astone's raised hands,
# her tell, and a heavy crash where it lands. Vanilla sounds until A3's own (RLM-126).
id: astone_boulder
category: spell
events:
  form:
    subtitle: {en_us: Boulder forms}
    sounds:
      - {event: minecraft:block.grindstone.use, pitch: 0.5}
  impact:
    subtitle: {en_us: Boulder crashes}
    sounds:
      - {event: minecraft:block.deepslate.break, pitch: 0.7}
      - {event: minecraft:block.stone.break, pitch: 0.6}
