# yaml-language-server: $schema=../../tools/schemas/sounds.schema.json
# Rockfall's sound (W5b, RLM-491): cracking rock as Astone calls rocks down, her tell to step out of the marked
# ring. Vanilla sounds until A3's own (RLM-126).
id: astone_rockfall
category: spell
events:
  crack:
    subtitle: {en_us: Astone calls down rocks}
    sounds:
      - {event: minecraft:block.pointed_dripstone.break, pitch: 0.6}
      - {event: minecraft:block.dripstone_block.break, pitch: 0.5}
