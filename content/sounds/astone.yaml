# yaml-language-server: $schema=../../tools/schemas/sounds.schema.json
# Astone's sounds (W5b, RLM-491; Realmforge Mobs Guideline, section 9; RLM-621): a deep grinding rumble now and
# then, a heavy stone crack when she is hurt, a crushing fall into rubble when she dies, steps heavier than a
# Sentinel's, and her fist smashing down.
# Our own sounds from ElevenLabs (ADR 0079), an agent's provisional picks until Matěj listens (RLM-669).
id: astone
category: entity
events:
  ambient:
    subtitle: {en_us: Astone rumbles}
    sounds:
      - {file: astone/ambient_1}
      - {file: astone/ambient_2}
  hurt:
    subtitle: {en_us: Astone cracks}
    sounds:
      - {file: astone/hurt_1}
      - {file: astone/hurt_2}
  death:
    subtitle: {en_us: Astone crumbles}
    sounds:
      - {file: astone/death_1}
  step:
    subtitle: {en_us: Astone stomps}
    sounds:
      - {file: astone/step_1, volume: 0.8}
      - {file: astone/step_2, volume: 0.8}
  attack:
    subtitle: {en_us: Astone smashes}
    sounds:
      - {file: astone/attack_1}
