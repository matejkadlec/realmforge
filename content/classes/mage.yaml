# yaml-language-server: $schema=../../tools/schemas/classes.schema.json
# The M1 caster (decision D1, RLM-51): intellect. A caster starts with 100 Max Mana and 5 Mana Regeneration, 5 mana a
# second (Matěj, 2026-10-14); it starts with the Stone Wand (RLM-172) and the Apprentice's set (RLM-197). The stats stay
# the same at every level: each level gives a stat point to spend instead, and the class keeps these as its starting
# identity until Matěj decides on them (2026-10-15, RLM-196). M1's tree is the Frost Mage's "Shatter" (RLM-542; Matěj,
# 2026-10-30, RLM-333), a new row every 6 levels; four active spells by the end of chapter 1 (D4: 4 x N, passives
# aside). Picking the specialization gives Frostbolt free at rank 1, and every other rank costs a spell point (C5,
# Matěj, 2026-11-04). Fire and Arcane come with their trees in M3 (RLM-218), and Fireball and Arcane Missiles with them.
# The Mage never heals: it survives through shields and utility (Matěj, 2026-10-22).
id: mage
name:
  en_us: Mage
description:
  en_us: Strikes from afar with fire, frost and arcane power, drawn from a well of mana.
role: caster
resource: realmforge:mana
modifiers:
  - {attribute: realmforge:intellect, operation: add_value, amount: 5}
  - {attribute: realmforge:vitality, operation: add_value, amount: 2}
  - {attribute: realmforge:dexterity, operation: add_value, amount: 1}
  - {attribute: realmforge:max_mana, operation: add_value, amount: 100}
  - {attribute: realmforge:mana_regeneration, operation: add_value, amount: 5}
starting_kit:
  - {item: realmforge:stone_wand}
  - {item: realmforge:apprentice_hat}
  - {item: realmforge:apprentice_robes}
  - {item: realmforge:apprentice_pants}
  - {item: realmforge:apprentice_boots}
  - {item: minecraft:bread, count: 32}
specializations:
  - id: fire
    name: {en_us: Fire}
    description: {en_us: "Set your enemies alight and let the flames do the work."}
  - id: frost
    name: {en_us: Frost}
    description: {en_us: "Slow your enemies, freeze them, then break them."}
    first_spell: realmforge:frostbolt
    spells:
      - {spell: realmforge:improved_frostbolt, level: 1, column: 1}
      - {spell: realmforge:frostbolt, level: 1, column: 2}
      - {spell: realmforge:cone_of_cold, level: 1, column: 3}
      - {spell: realmforge:ice_lance, level: 6, column: 1}
      - {spell: realmforge:frost_nova, level: 6, column: 2}
      - {spell: realmforge:frostbite, level: 6, column: 3}
      - {spell: realmforge:shatter, level: 12, column: 1}
      - {spell: realmforge:ice_barrier, level: 12, column: 2}
      - {spell: realmforge:blizzard, level: 18, column: 1}
  - id: arcane
    name: {en_us: Arcane}
    description: {en_us: "Spend your mana freely and strike hard with raw magic."}
