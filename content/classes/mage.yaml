# yaml-language-server: $schema=../../tools/schemas/classes.schema.json
# The M1 caster (decision D1, RLM-51): intellect. A caster starts with 100 Max Mana and 5 Mana Regeneration, 5 mana a
# second (Matěj, 2026-10-14). Its spells come in C4; it starts with the Stone Wand (RLM-172) and the Apprentice's
# set (RLM-197). The stats stay the same at every level: each level gives a stat point to spend instead, and the
# class keeps these as its starting identity until Matěj decides on them (2026-10-15, RLM-196).
id: mage
name:
  en_us: Mage
description:
  en_us: Strikes from afar with fire, frost and arcane power, drawn from a well of mana.
role: caster
resource: realmforge:mana
modifiers:
  - {attribute: realmforge:intellect, operation: add_value, amount: 5}
  - {attribute: realmforge:vitality, operation: add_value, amount: 2}
  - {attribute: realmforge:dexterity, operation: add_value, amount: 1}
  - {attribute: realmforge:max_mana, operation: add_value, amount: 100}
  - {attribute: realmforge:mana_regeneration, operation: add_value, amount: 5}
starting_kit:
  - {item: realmforge:stone_wand}
  - {item: realmforge:apprentice_hat}
  - {item: realmforge:apprentice_robes}
  - {item: realmforge:apprentice_pants}
  - {item: realmforge:apprentice_boots}
  - {item: minecraft:bread, count: 32}
