# yaml-language-server: $schema=../../tools/schemas/classes.schema.json
# The M1 melee class (decision D1, RLM-51): strength and vitality. The stats stay the same at every level: each level
# gives a stat point to spend instead, and the class keeps these as its starting identity until Matěj decides on them
# (2026-10-15, RLM-196). M1's tree is the Arms Warrior's "Bloodletter" (RLM-543; Matěj, 2026-10-30, RLM-333), a new row
# every 6 levels; four active spells by the end of chapter 1 (D4: 4 x N, passives aside). Picking the specialization
# gives Slam free at rank 1, and every other rank costs a spell point (C5, Matěj, 2026-11-04). Fury and Protection come
# with their trees in M3 (RLM-218), and Reckless Strike and Shield Bash with them.
id: warrior
name:
  en_us: Warrior
description:
  en_us: Fights up close with steel and a stubborn heart. Rage builds as you trade blows.
role: melee
resource: realmforge:rage
# A full-strength hit gives 10 rage, losing half the max health to attackers 25, and 5 s after the last hit dealt or
# taken the pool loses 2 a second (C3a-4, RLM-212). C4's first balance pass keeps them: a Stone Sword's full-strength
# hits every 0.625 s give 16 a second, about what Slam, Rend and Overpower cost on cooldown together (7.5 + 3.3 to 6.7
# by Rend's rank + 5 a second, RLM-604), so a Warrior who keeps swinging casts all three with little left to bank for
# Execute; Charge gives 10/20 more.
rage:
  per_hit_dealt: 10
  per_max_health_taken: 50
  decay_per_second: 2
  decay_after_seconds: 5
modifiers:
  - {attribute: realmforge:strength, operation: add_value, amount: 5}
  - {attribute: realmforge:vitality, operation: add_value, amount: 4}
  - {attribute: realmforge:dexterity, operation: add_value, amount: 2}
starting_kit:
  - {item: minecraft:stone_sword}
  - {item: minecraft:shield}
  - {item: minecraft:leather_helmet}
  - {item: minecraft:leather_chestplate}
  - {item: minecraft:leather_leggings}
  - {item: minecraft:leather_boots}
  - {item: minecraft:bread, count: 32}
specializations:
  - id: arms
    name: {en_us: Arms}
    description: {en_us: "Cut deep, let the wounds bleed, and finish what you start."}
    first_spell: realmforge:slam
    spells:
      - {spell: realmforge:charge, level: 1, column: 1}
      - {spell: realmforge:slam, level: 1, column: 2}
      - {spell: realmforge:deep_wounds, level: 1, column: 3}
      - {spell: realmforge:rend, level: 6, column: 1}
      - {spell: realmforge:battle_shout, level: 6, column: 2}
      - {spell: realmforge:two_handed_weapon_specialization, level: 6, column: 3}
      - {spell: realmforge:bloodthirst, level: 12, column: 1, requires: realmforge:rend}
      - {spell: realmforge:overpower, level: 12, column: 2}
      - {spell: realmforge:victory_rush, level: 12, column: 3}
      - {spell: realmforge:execute, level: 18, column: 1}
  - id: fury
    name: {en_us: Fury}
    description: {en_us: "Swing fast and hard, and let your rage carry you."}
  - id: protection
    name: {en_us: Protection}
    description: {en_us: "Raise your shield and stand where others fall."}
