# yaml-language-server: $schema=../../tools/schemas/classes.schema.json
# The M1 melee class (decision D1, RLM-51): strength and vitality. The stats stay the same at every level: each level
# gives a stat point to spend instead, and the class keeps these as its starting identity until Matěj decides on them
# (2026-10-15, RLM-196). Its kit is the Arms Warrior's "Bloodletter" tree (RLM-543; Matěj, 2026-10-30, RLM-333): until
# the spell trees window (C5) spends points, the kit teaches every spell of the tree at rank 1 at its row's level, a row
# every 6 levels: Slam (decision D4's starting spell), Charge and Deep Wounds at 1; Rend, Battle Shout and Two-Handed
# Weapon Specialization at 6; Bloodthirst, Overpower and Victory Rush at 12; Execute at 18. Four active spells by
# the end of chapter 1 (D4: 4 x N, passives aside). Reckless Strike and Shield Bash leave the kit and return with their
# trees in M3.
id: warrior
name:
  en_us: Warrior
description:
  en_us: Fights up close with steel and a stubborn heart. Rage builds as you trade blows.
role: melee
resource: realmforge:rage
# A full-strength hit gives 10 rage, losing half the max health to attackers 25, and 5 s after the last hit dealt or
# taken the pool loses 2 a second (C3a-4, RLM-212). C4's first balance pass keeps them: a Stone Sword's full-strength
# hits every 0.625 s give 16 a second, more than Slam, Rend and Overpower cost on cooldown together (5 + 1.7 + 1 a
# second), so a Warrior who keeps swinging casts all three and banks the rest for Execute; Charge gives 15/20 more.
rage:
  per_hit_dealt: 10
  per_max_health_taken: 50
  decay_per_second: 2
  decay_after_seconds: 5
modifiers:
  - {attribute: realmforge:strength, operation: add_value, amount: 5}
  - {attribute: realmforge:vitality, operation: add_value, amount: 4}
  - {attribute: realmforge:dexterity, operation: add_value, amount: 2}
starting_kit:
  - {item: minecraft:stone_sword}
  - {item: minecraft:shield}
  - {item: minecraft:leather_helmet}
  - {item: minecraft:leather_chestplate}
  - {item: minecraft:leather_leggings}
  - {item: minecraft:leather_boots}
  - {item: minecraft:bread, count: 32}
spells:
  - {spell: realmforge:slam, level: 1}
  - {spell: realmforge:charge, level: 1}
  - {spell: realmforge:deep_wounds, level: 1}
  - {spell: realmforge:rend, level: 6}
  - {spell: realmforge:battle_shout, level: 6}
  - {spell: realmforge:two_handed_weapon_specialization, level: 6}
  - {spell: realmforge:bloodthirst, level: 12}
  - {spell: realmforge:overpower, level: 12}
  - {spell: realmforge:victory_rush, level: 12}
  - {spell: realmforge:execute, level: 18}
