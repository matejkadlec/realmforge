# yaml-language-server: $schema=../../tools/schemas/items.schema.json
# The Stone Sigil (W2b, realm portal spec "Realm sigils"): right-clicked on a realm selector, it opens the realm portal
# onto Undervault, for a player who has unlocked it. Never used up, one opens any number of portals, and lava does not
# take it. Its tooltip names the realm (content/realms/stone.yaml names it as the sigil). Chapter 1's last main quest
# rewards it (Q2); until then `/give @s realmforge:stone_sigil`. The generated placeholder until the A* textures.
id: stone_sigil
name:
  en_us: Stone Sigil
max_stack_size: 1
fire_resistant: true
creative_tabs:
  - minecraft:tools_and_utilities
