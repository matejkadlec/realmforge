# yaml-language-server: $schema=../../tools/schemas/items.schema.json
# The Mage's starting wand (Matěj's playtest of C1, 2026-10-14: "something like a Stone Wand"), one of the seven
# wands of RLM-172. Its id is the one C1's placeholder had, so the Mage's kit (content/classes/mage.yaml) keeps it.
# Spell Power, Cast Time Reduction and Cooldown Reduction are Matěj's (2026-10-15); attack damage, durability,
# enchantability and the repair material are vanilla's tool of the same material (attack damage: Claude's, Matěj
# delegated it). Attack speed 1.0, so swinging one is never worth it. Its stats count in the main hand only. It
# takes both hands: no shield with it, and every shield stays locked for 3 minutes after (Matěj, 2026-10-26).
# Recipe (Matěj, 2026-10-26): an amethyst shard over the material over a stick.
# The generated placeholder texture until A1's art.
id: stone_wand
name:
  en_us: Stone Wand
creative_tabs:
  - minecraft:combat
color: "#8A8A8A"
gear:
  kind: wand
  durability: 131
  enchantability: 5
  repair_with: "#minecraft:stone_tool_materials"
  attack_damage: 2
  attack_speed: 1.0
  two_handed: true
  modifiers:
    - {attribute: realmforge:spell_power, operation: add_value, amount_percent: 15}
    - {attribute: realmforge:cast_time_reduction, operation: add_value, amount_percent: 5}
    - {attribute: realmforge:cooldown_reduction, operation: add_value, amount_percent: 5}
recipe:
  pattern: [A, M, S]
  key:
    A: minecraft:amethyst_shard
    M: "#minecraft:stone_tool_materials"
    S: minecraft:stick
  category: equipment
