# yaml-language-server: $schema=../../tools/schemas/items.schema.json
# One of the seven wands of RLM-172, a caster's weapon from wood to netherite.
# Spell Power, Cast Time Reduction and Cooldown Reduction are Matěj's (2026-10-15); attack damage, durability,
# enchantability and the repair material are vanilla's tool of the same material (attack damage: Claude's, Matěj
# delegated it). Attack speed 1.0, so swinging one is never worth it. Its stats count in the main hand only.
# Recipe (Claude's proposal from the gear proposal, RLM-172): the material over lapis lazuli over a stick.
# The generated placeholder texture until A1's art.
id: wooden_wand
name:
  en_us: Wooden Wand
creative_tabs:
  - minecraft:combat
color: "#8B6A3E"
gear:
  kind: wand
  durability: 59
  enchantability: 15
  repair_with: "#minecraft:wooden_tool_materials"
  attack_damage: 1
  attack_speed: 1.0
  modifiers:
    - {attribute: realmforge:spell_power, operation: add_value, amount_percent: 10}
    - {attribute: realmforge:cast_time_reduction, operation: add_value, amount_percent: 3}
    - {attribute: realmforge:cooldown_reduction, operation: add_value, amount_percent: 3}
recipe:
  pattern: [M, L, S]
  key:
    M: "#minecraft:wooden_tool_materials"
    L: minecraft:lapis_lazuli
    S: minecraft:stick
  category: equipment
