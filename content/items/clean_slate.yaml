# yaml-language-server: $schema=../../tools/schemas/items.schema.json
# Unlearns every spent stat point, which are then unspent again (RLM-196). Hard to get on purpose: Matěj wants it as
# the reward of a hard repeatable quest, or an expensive shop item once coins exist (2026-10-15). It has no recipe;
# the quest that gives it waits for Q1 (RLM-37). Not "Tome of Unlearning": ATLYSS has an item of that name, and the
# lore style guide takes no names from other games.
id: clean_slate
name:
  en_us: Clean Slate
max_stack_size: 16
creative_tabs:
  - minecraft:tools_and_utilities
use: unlearn_stat_points
flavor:
  en_us: Wiped smooth, as if nothing was ever written on it.
