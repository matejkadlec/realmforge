# yaml-language-server: $schema=../../tools/schemas/items.schema.json
# Unlearns every spent stat point, which are then unspent again (RLM-196). Hard to get on purpose: Matěj wants it as
# the reward of a hard repeatable quest (RLM-213), or an expensive shop item once coins exist (2026-10-15). It has no
# recipe. Named by Matěj (2026-10-16), one of three scrolls that share a scroll texture in different colour tones:
# this one purple-ish; the Scroll of Respecialization (spell points) yellow-ish, the Scroll of Rebirth (the whole
# character) red-ish. Until the textures exist (RLM-46) it shows the generated placeholder.
id: oblivion_scroll
name:
  en_us: Scroll of Oblivion
max_stack_size: 16
creative_tabs:
  - minecraft:tools_and_utilities
use: unlearn_stat_points
flavor:
  en_us: The ink fades as you read, and so does everything you learned.
