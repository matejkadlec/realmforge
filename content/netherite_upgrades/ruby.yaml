# yaml-language-server: $schema=../../tools/schemas/netherite_upgrades.schema.json
# The offense upgrade (Matěj, 2026-10-30, RLM-511): +5 % Attack Damage on a melee piece, +5 % Spell Power on a caster
# piece. Both are percents on the total's base (architecture 8.2): four Rubies give +20 %, and on Spell Power, flat
# points since RLM-534, +20 % of the robes' and the wand's points. Later, on a ranged piece: +5 % Arrow Damage (M3).
id: ruby
name:
  en_us: Ruby Upgrade
color: "#C42638"
item: realmforge:ruby_upgrade
template: minecraft:netherite_upgrade_smithing_template
melee:
  - {attribute: minecraft:attack_damage, operation: add_multiplied_base, amount_percent: 5}
caster:
  - {attribute: realmforge:spell_power, operation: add_multiplied_base, amount_percent: 5}
