# yaml-language-server: $schema=../../tools/schemas/effects.schema.json
# The Warrior's Battle Shout (C4): +5 % attack damage and +10 % attack speed at Battle Shout I, twice that at II (the
# spell's rank 2), for the Warrior and every ally the shout reaches (Matěj, 2026-11-03, RLM-543's Confluence comments;
# it was +10/15/20 % attack damage).
id: battle_shout
name: {en_us: Battle Shout}
category: beneficial
color: "#F5241B"
modifiers:
  - {attribute: minecraft:attack_damage, operation: add_multiplied_total, amount_percent: 5}
  - {attribute: minecraft:attack_speed, operation: add_multiplied_total, amount_percent: 10}
