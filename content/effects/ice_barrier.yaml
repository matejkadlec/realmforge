# yaml-language-server: $schema=../../tools/schemas/effects.schema.json
# The Mage's Ice Barrier (C4; the Mage survives through shields, not heals, Matěj, 2026-10-22): +10 Magic Shield at
# Ice Barrier I, 20 at II and 30 at III (the spell's ranks 1 to 3, Matěj, 2026-10-30), and the points it adds fill the
# pool at once (combat/MagicShields), so it shields in a fight too.
id: ice_barrier
name: {en_us: Ice Barrier}
category: beneficial
color: "#7FD4FF"
modifiers:
  - {attribute: realmforge:magic_shield, operation: add_value, amount: 10}
