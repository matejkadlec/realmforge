# yaml-language-server: $schema=../../tools/schemas/apotheosis_rarity_overrides.schema.json
# The robe category of the head slot (RLM-546) has no affix to roll until the caster affixes (RLM-557), so every rarity
# keeps its sockets and durability and drops its affix slots: a robe reforged gets a rarity without an error for each
# empty slot. RLM-557 replaces this with the robes' own slots.
id: robe_head
category: realmforge:robe_head
no_affixes: true
