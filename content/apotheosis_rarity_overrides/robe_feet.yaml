# yaml-language-server: $schema=../../tools/schemas/apotheosis_rarity_overrides.schema.json
# The robe feet skip the ability slot, so Apotheosis logs no empty slot (RLM-557): Unhurried is the boots' one ability,
# and Apotheosis hard-codes it to its own boots category (AttributeToggleAffix#canApplyTo), which no data can widen.
id: robe_feet
category: realmforge:robe_feet
max_slots:
  apotheosis:rare: {ability: 0}
  apotheosis:epic: {ability: 0}
  apotheosis:mythic: {ability: 0}
