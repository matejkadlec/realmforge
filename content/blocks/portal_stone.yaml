# yaml-language-server: $schema=../../tools/schemas/blocks.schema.json
# Portal Stone (W2b, realm portal spec "The frame"): 13 of it and a realm selector frame a realm portal, 5 wide and 6
# tall around a 3x4 opening. Cheap and from Overworld, because the first frame is built before any realm is open: 4
# stone bricks around a copper ingot make 4 (the spec's tag of bricks, which would take a realm's own bricks too, comes
# with the first realm bricks). Pistons cannot move it. A frame a trip built drops nothing (its `generated` state).
# The numbers are proposals for Matěj's playtest.
id: portal_stone
name:
  en_us: Portal Stone
kind: portal_stone
hardness: 3
blast_resistance: 6
tool: pickaxe
requires_tool: true
sound: stone
map_color: color_gray
creative_tabs:
  - minecraft:functional_blocks
recipe:
  pattern:
    - " S "
    - SCS
    - " S "
  key:
    S: minecraft:stone_bricks
    C: minecraft:copper_ingot
  count: 4
  category: building
