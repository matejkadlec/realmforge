# Gatewright Bricks (W2b, realm portal spec "The frame"; named by Matěj, 2026-10-23, RLM-394, once Realmforge Bricks):
# 13 of them and a Gatewright Sealstone frame a realm portal, 5 wide and 6 tall around a 3x4 opening. The bricks of
# eight Overworld stones around an ender pearl make 8 (Matěj, 2026-10-20 and 2026-10-23): stone, deepslate, quartz, mud
# and tuff bricks from vanilla, and our diorite, granite and andesite bricks. A frame and its sealstone take 17, so 3
# crafts and 3 ender pearls. Pistons cannot move them. A frame a trip built drops nothing (its `generated` state). The
# numbers are proposals for Matěj's playtest.
id: gatewright_bricks
name:
  en_us: Gatewright Bricks
kind: gatewright_bricks
hardness: 3
blast_resistance: 6
tool: pickaxe
requires_tool: true
