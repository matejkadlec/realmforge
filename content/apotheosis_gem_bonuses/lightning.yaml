# yaml-language-server: $schema=../../tools/schemas/apotheosis_gem_bonuses.schema.json
# Lightning's extra bonuses (Matěj, 2026-10-30, RLM-536): on a wand Cooldown Reduction (RLM-547); on the robe legs and
# feet its armor's Movement Speed (RLM-548).
id: lightning
gem: apotheosis:core/lightning
bonuses:
  - gem_class: realmforge:wand
    attribute: realmforge:cooldown_reduction
    operation: add_value
    values: {cracked: 0.05, chipped: 0.075, flawed: 0.1, normal: 0.125, flawless: 0.15, perfect: 0.2}
  - gem_class: {key: robe_lower, types: [realmforge:robe_legs, realmforge:robe_feet]}
    like: apotheosis:leggings
