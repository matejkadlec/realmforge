# yaml-language-server: $schema=../../tools/schemas/apotheosis_gem_bonuses.schema.json
# Breach's wand bonus (Matěj, 2026-10-30, RLM-536, RLM-547): Spell Penetration, the caster's answer to the mobs' and
# bosses' resistances (RLM-535). With Verdant Ruin it can pass the stat's 50 % cap, which then holds. No robe bonus:
# Breach fits no armor.
id: breach
gem: apotheosis:core/breach
bonuses:
  - gem_class: realmforge:wand
    attribute: realmforge:spell_penetration
    operation: add_value
    values: {cracked: 0.05, chipped: 0.1, flawed: 0.15, normal: 0.2, flawless: 0.25, perfect: 0.3}
