# yaml-language-server: $schema=../../tools/schemas/apotheosis_gem_bonuses.schema.json
# Verdant Ruin's extra bonuses (Matěj, 2026-10-30, RLM-536): on a wand Spell Penetration with less Magic Shield, from
# Flawed as it drops; a Perfect one reaches the stat's 50 % cap alone (RLM-535, RLM-547). On the robe chest its
# chestplate's magic damage reduction (vanilla's magic only: our schools are out of #c:is_magic, RLM-549), and on the
# robe feet its boots' Knockback Resistance and less Attack Knockback (RLM-548).
id: verdant_ruin
gem: apotheosis:overworld/verdant_ruin
bonuses:
  - gem_class: realmforge:wand
    modifiers:
      - attribute: realmforge:spell_penetration
        operation: add_value
        values: {flawed: 0.2, normal: 0.3, flawless: 0.4, perfect: 0.5}
      - attribute: realmforge:magic_shield
        operation: add_multiplied_base
        values: {flawed: -0.05, normal: -0.1, flawless: -0.15, perfect: -0.2}
  - gem_class: realmforge:robe_chest
    like: apotheosis:chestplate
  - gem_class: realmforge:robe_feet
    like: apotheosis:boots
