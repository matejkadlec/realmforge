# yaml-language-server: $schema=../../tools/schemas/stat_rules.schema.json
# What Dexterity gives (Matěj, RLM-170; the next numbers after F4's, not the final ones): crit chance (spells too) for
# everyone, attack speed for melee and ranged classes and cooldown reduction for casters instead, movement and
# swimming speed at 10 points, more crits and speed at 25.
id: dexterity
stat: realmforge:dexterity
per_point:
  - attribute: realmforge:crit_chance
    operation: add_value
    amount_percent: 0.5
  - attribute: minecraft:attack_speed
    operation: add_multiplied_base
    amount_percent: 1.5
    roles: [melee, ranged]
  - attribute: realmforge:cooldown_reduction
    operation: add_value
    amount_percent: 1.5
    roles: [caster]
milestones:
  - points: 10
    modifiers:
      - {attribute: minecraft:movement_speed, operation: add_multiplied_base, amount_percent: 20}
      - {attribute: neoforge:swim_speed, operation: add_multiplied_base, amount_percent: 20}
  - points: 25
    modifiers:
      - {attribute: realmforge:crit_chance, operation: add_value, amount_percent: 10}
      - {attribute: minecraft:attack_speed, operation: add_multiplied_base, amount_percent: 20, roles: [melee, ranged]}
      - {attribute: realmforge:cooldown_reduction, operation: add_value, amount_percent: 20, roles: [caster]}
