# yaml-language-server: $schema=../../tools/schemas/stat_rules.schema.json
# What Strength gives (D5, RLM-55): the vision's "10 STR = +10 % attack damage", on the weapon's damage too. First
# numbers; RLM-136 plays them with the character sheet.
id: strength
stat: realmforge:strength
per_point:
  - attribute: minecraft:attack_damage
    operation: add_multiplied_base
    amount_percent: 1
milestones:
  - points: 25
    modifiers:
      - attribute: realmforge:crit_damage
        operation: add_value
        amount_percent: 10
