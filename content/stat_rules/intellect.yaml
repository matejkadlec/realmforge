# yaml-language-server: $schema=../../tools/schemas/stat_rules.schema.json
# What Intellect gives (D5, RLM-55): spell power, the caster's counterpart of Strength (+1 % per point). First
# numbers; RLM-136 plays them with the character sheet.
id: intellect
stat: realmforge:intellect
per_point:
  - attribute: realmforge:spell_power
    operation: add_value
    amount_percent: 1
milestones:
  - points: 25
    modifiers:
      - attribute: realmforge:haste
        operation: add_value
        amount_percent: 5
