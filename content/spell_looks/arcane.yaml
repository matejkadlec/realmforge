# yaml-language-server: $schema=../../tools/schemas/spell_looks.schema.json
# The arcane look (RLM-639, RLM-442, docs/design/spell-visuals.md): Matěj's school colours, purple and dark purple
# (RLM-29, 2026-10-21):
# - behind a crystal, motes and a sparkle;
# - where it hits, motes and sparkles fly out and one ring widens from the middle of the hit;
# - at the hands that channel Arcane Missiles, flecks and sparkles for the whole channel (WoW's glowing hands).
# Its material is art/textures/material/arcane.png once it has art (art/README.md). Its impact sound is vanilla's;
# Arcane Missiles names its own (RLM-445).
id: arcane
colors: ["#E7C6FF", "#D6A2FF", "#C77DFF", "#A85CF0", "#8B3FD9", "#6A28B8", "#4E1A8F", "#35106B"]
trail:
  - {particle: realmforge:mote, per_block: 2}
  - {particle: realmforge:sparkle, per_block: 1, colors: ["#F3E2FF", "#E7C6FF", "#D6A2FF"]}
burst:
  - {particle: realmforge:mote, count: 12}
  - {particle: realmforge:sparkle, count: 8, colors: ["#F3E2FF", "#E7C6FF", "#D6A2FF"]}
  - {particle: realmforge:ring, count: 1, spread: 0, colors: ["#D6A2FF", "#C77DFF"]}
swirl:
  - {particle: realmforge:fleck, per_tick: 4}
  - {particle: realmforge:sparkle, per_tick: 2, colors: ["#F3E2FF", "#E7C6FF", "#D6A2FF"]}
impact_sound: minecraft:block.amethyst_cluster.break
