# yaml-language-server: $schema=../../tools/schemas/spell_looks.schema.json
# The fire look (RLM-639, docs/design/spell-visuals.md): Matěj's school colours, orange and black (RLM-29,
# 2026-10-21): embers behind the ball and where it bursts, flecks swirling in while it forms. Its models are drawn at full
# brightness (Matěj: "Fireball lights its surroundings"; the light on the blocks round it waits for dynamic lights,
# ADR 0075). The sound is vanilla's until the spell sounds (RLM-445).
id: fire
colors: ["#FFD27F", "#FFB347", "#FF9A1F", "#FF7F1F", "#E85D04", "#B23A05", "#5C1F0A", "#1F1410"]
trail: {particle: realmforge:ember, per_block: 3}
burst: {particle: realmforge:ember, count: 20}
swirl: {particle: realmforge:fleck, per_tick: 6}
light: emit
impact_sound: minecraft:entity.generic.extinguish_fire
