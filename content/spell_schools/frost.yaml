# yaml-language-server: $schema=../../tools/schemas/spell_schools.schema.json
# One of the Mage's schools (D1). Magic: bypasses armor; spell power and Frost Power raise it, Frost Resistance
# lowers it.
id: frost
name: {en_us: Frost}
kind: magic
color: "#7FD4FF"
# A crit in combat text: a deep blue, darker than the hit's colour and still readable at night (RLM-553).
crit_color: "#2D7DFF"
power: realmforge:frost_power
resistance: realmforge:frost_resistance
death_message: {en_us: "%1$s froze solid"}
