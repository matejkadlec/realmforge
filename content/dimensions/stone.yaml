# yaml-language-server: $schema=../../tools/schemas/dimensions.schema.json
# Undervault, the stone realm (W2a, RLM-32): chapter 2, levels 6 to 18 (RLM-188). Mob levels follow the nearest player
# as in the Overworld (RLM-303), floored at the realm's entry level, 6: a player below it meets every mob at 6.
id: stone
dimension: realmforge:stone
mob_levels:
  entry_level: 6
  max_level: 60
  weights: [5, 10, 20, 30, 20, 10, 5]
# Sealed until the player's own unlock (realm portal spec, "Access and unlocks"): chapter 1's last main quest grants
# it (Q2); `/advancement grant @s only realmforge:realm/stone` until then.
access:
  - type: realmforge:has_advancement
    advancement: realmforge:realm/stone
