# yaml-language-server: $schema=../../tools/schemas/dimensions.schema.json
# Mob levels follow the nearest player (RLM-240, part 1: RLM-303): within 3 levels of theirs, most often their own,
# never below the realm's entry level (the Overworld's is 1) nor above 60 (RLM-240). The weights are the chances of -3
# to +3 levels from the player's, in percent; the floor and the cap drop offsets, and the rest share the chance by
# their weights. The scaling each level brings is in the mob_* curves.
id: overworld
dimension: minecraft:overworld
mob_levels:
  entry_level: 1
  max_level: 60
  weights: [5, 10, 20, 30, 20, 10, 5]
