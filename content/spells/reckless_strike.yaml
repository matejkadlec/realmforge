# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# Fury's first spell (C4, RLM-392): a reckless thrust, Medium damage, with 10 % more chance to crit at rank 1 and 5 %
# more per rank (30 % at rank 5). Crit chance above 100 % turns into crit damage 1:1 (combat/DamageCalculator). It needs
# a melee weapon (RLM-499). Rage per second of cooldown: 20 / 4 s = 5. With a Stone Sword at level 1, about 7 damage.
id: reckless_strike
name: {en_us: Reckless Strike}
description: {en_us: "Strikes an enemy recklessly for {damage} damage, with {crit_chance}% more chance to crit."}
school: realmforge:physical
scales_with: attack_damage
targeting: {type: realmforge:enemy, range: 4}
cast: {type: instant}
cost: {resource: realmforge:rage, amount: 20}
cooldown_seconds: 4
max_level: 5
requires: [melee_weapon]
crit: {bonus_chance_percent: 10, bonus_chance_per_level_percent: 5}
effects:
  - {type: realmforge:damage, amount: 2, per_level: 1, attack_damage_percent: 100}
