# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# Astone's quake (W5b, RLM-491), from her second phase on: a 3 s channel in which she beats her fists up and down
# (animation slam, unlike the raised arms of her boulder), and every slam, every 0.75 s, shakes the ground round her:
# damage and a short slow for every enemy inside, as long as it stays, like a real earthquake (Matěj's playtest,
# 2026-10-29: one hit felt like the boulder). A ring of dark grey dust marks its reach round her the whole time
# (BossMob) and grey dust each slam's edge, so stepping out of it stops the damage. She begins it only while her target
# stands inside it. Proposals for Matěj's playtest.
id: astone_quake
name: {en_us: Quake}
description: {en_us: "Slams the ground again and again, dealing {damage} damage to every enemy within {radius} blocks with each slam."}
school: realmforge:physical
scales_with: attack_damage
targeting: {type: realmforge:self}
cast:
  type: channel
  duration_seconds: 3
  interval_seconds: 0.75
  sound: realmforge:spell.astone_quake.rumble
  animation: slam
cooldown_seconds: 12
npc_only: true
effects:
  - type: realmforge:area
    radius: 5
    duration_seconds: 0.5
    interval_seconds: 0.5
    ring_color: "#8C8C8C"
    effects:
      - {type: realmforge:damage, amount: 1, attack_damage_percent: 30}
      - {type: realmforge:apply_effect, effect: minecraft:slowness, duration_seconds: 1.5}
