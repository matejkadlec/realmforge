# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Warrior's self-buff (C4): a war cry that raises the attack damage of the Warrior and every ally within 10 blocks
# by 10 / 15 / 20 % for 10 / 15 / 20 s by rank, on a 1 minute cooldown (Matěj, 2026-10-30). Its effect is a flat share
# that nothing raises, spell power included; Cooldown Reduction shortens its cooldown, and a second shout, the
# Warrior's own or another's, refreshes the effect instead of stacking it.
id: battle_shout
name: {en_us: Battle Shout}
description: {en_us: "Lets out a war cry that raises your attack damage and your allies' within {radius} blocks by {bonus}% for {duration} sec."}
school: realmforge:physical
scales_with: attack_damage
targeting: {type: realmforge:self}
cast: {type: instant}
cost: {resource: realmforge:rage, amount: 10}
cooldown_seconds: 60
max_level: 3
effects:
  - type: realmforge:area
    radius: 10
    duration_seconds: 0.5
    interval_seconds: 0.5
    affects: allies
    ring_color: "#F5241B"
    effects:
      - type: realmforge:apply_effect
        effect: realmforge:battle_shout
        duration_seconds: 10
        duration_per_level_seconds: 5
        stronger_at_levels: [2, 3]
