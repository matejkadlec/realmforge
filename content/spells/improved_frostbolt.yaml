# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Frost Mage's tree, row 1 (level 1), left (Matěj, 2026-10-30, "Spell Trees to Level 18", chosen for M1; RLM-541,
# RLM-542): Frostbolt deals 5/10/15 % more damage, added to its hit's (1 + Frost Power + passives) layer, its splash's
# too. Frostbolt's splash (RLM-399) already slows every enemy it damages, so rank 3's extra widens the splash from 1 to
# 1.5 blocks instead (Matěj, 2026-10-31: "hits harder and chills wider").
id: improved_frostbolt
name: {en_us: Improved Frostbolt}
description:
  en_us: >-
    Your Frostbolt deals {spell_damage}% more damage. From rank {splash_radius_rank}, its splash reaches
    {splash_radius} blocks farther.
school: realmforge:frost
max_level: 3
passive:
  spell_damage:
    - spells: [realmforge:frostbolt]
      damage_percent: 5
      damage_per_level_percent: 5
  splash_radius:
    - spells: [realmforge:frostbolt]
      radius: 0.5
      from_level: 3
