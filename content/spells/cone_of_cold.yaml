# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Frost Mage's tree, row 1 (level 1), right (RLM-542; Matěj, 2026-10-30, "Spell Trees to Level 18", chosen for M1):
# an instant cone of frost 5 blocks ahead of the Mage, about 60° wide, that hits every enemy in it for 5/6/7 + 60/70/80 %
# of Spell Power and slows them (Slowness II for 3/4/5 s). An area spell's coefficient is about a third of a
# single-target spell's per target (architecture 11.1). A 10 s cooldown, 30 mana. It follows the look, so it needs no
# target, and never hits through walls. Placeholder particles and sound until the Frost visuals (RLM-544).
id: cone_of_cold
name: {en_us: Cone of Cold}
description:
  en_us: >-
    Blasts a cone of frost {radius} blocks ahead of you, dealing {damage} damage to every enemy in it and slowing them
    for {duration} sec.
school: realmforge:frost
scales_with: spell_power
targeting: {type: realmforge:self}
cast: {type: instant}
cost: {resource: realmforge:mana, amount: 30}
cooldown_seconds: 10
max_level: 3
effects:
  - type: realmforge:cone
    range: 5
    angle_degrees: 60
    sound: minecraft:entity.player.hurt_freeze
    particles: minecraft:packed_ice
    effects:
      - type: realmforge:damage
        amount: 5
        per_level: 1
        spell_power_percent: 60
        spell_power_per_level_percent: 10
      - type: realmforge:apply_effect
        effect: minecraft:slowness
        amplifier: 1
        duration_seconds: 3
        duration_per_level_seconds: 1
