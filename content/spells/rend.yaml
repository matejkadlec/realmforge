# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Arms Warrior's tree, row 2 (level 6), left (RLM-543; Matěj, 2026-10-30, "Spell Trees to Level 18", chosen for M1):
# a cut of 2/3/4 + 30/40/50 % of Attack Damage, then Bleeding (RLM-539) of 4/6/8 + 60/80/100 % of Attack Damage over 6 s,
# a tick every half second that ignores armor. Its ticks are what Taste for Blood watches. 10/20/30 rage (Matěj,
# 2026-11-03, RLM-543's Confluence comments), a 6 s cooldown, so a Warrior who keeps it up never lets the bleed run out. It needs a melee weapon (RLM-499), and its target must be in
# the Warrior's melee swing (melee: true, Matěj's playtest of 2026-10-31). Placeholder look until RLM-545.
id: rend
name: {en_us: Rend}
description:
  en_us: "Wounds an enemy for {damage} damage and makes it bleed for {dot_damage} more over {dot_duration} sec."
school: realmforge:physical
scales_with: attack_damage
targeting: {type: realmforge:enemy, melee: true}
cast: {type: instant}
cost: {resource: realmforge:rage, amount: 10, per_level: 10}
cooldown_seconds: 6
max_level: 3
requires: [melee_weapon]
effects:
  - {type: realmforge:damage, amount: 2, per_level: 1, attack_damage_percent: 30, attack_damage_per_level_percent: 10}
  - type: realmforge:damage_over_time
    effect: realmforge:bleeding
    amount: 4
    per_level: 2
    attack_damage_percent: 60
    attack_damage_per_level_percent: 20
    duration_seconds: 6
