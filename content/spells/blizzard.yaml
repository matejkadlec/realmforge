# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Frost Mage's tree, row 4 (level 18) (RLM-542; Matěj, 2026-10-30, "Spell Trees to Level 18", chosen for M1): a 3 s
# channel at a spot on the ground within 30 blocks (placed when the channel begins and kept, as every ground spell is,
# architecture 11.2), 6 waves of ice, one every 0.5 s as every player channel (RLM-518), each hitting every enemy within 3
# blocks of it for 2/2.5/3 + 20/25/30 % of Spell Power (a channel splits its coefficient over its ticks, architecture
# 11.1) and slowing them: Slowness I, Slowness II at rank 3. The tree's 40 mana a cast: a channel pays its cost as each
# second begins (RLM-403), so 13 mana for each of its 3 seconds, 39 in all. Placeholder rings until the Frost visuals
# (RLM-544).
id: blizzard
name: {en_us: Blizzard}
description:
  en_us: >-
    Calls down waves of ice on the ground while you channel, each dealing {damage} damage to every enemy within
    {radius} blocks and slowing them.
school: realmforge:frost
scales_with: spell_power
targeting: {type: realmforge:ground_point, range: 30}
cast: {type: channel, duration_seconds: 3, interval_seconds: 0.5}
cost: {resource: realmforge:mana, amount: 13}
max_level: 3
effects:
  - type: realmforge:area
    radius: 3
    duration_seconds: 0.5
    interval_seconds: 0.5
    ring_color: "#BFEFFF"
    effects:
      - type: realmforge:damage
        amount: 2
        per_level: 0.5
        spell_power_percent: 20
        spell_power_per_level_percent: 5
      - type: realmforge:apply_effect
        effect: minecraft:slowness
        duration_seconds: 1.5
        stronger_at_levels: [3]
