# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Mage's first spell (C4; Frost's first spell, RLM-391; decision D4's starting spell "a Frostbolt-like fast
# single-target cast that slows"), the Frost Mage's tree, row 1 (level 1), middle (RLM-542): a 1.5 s cast at every rank,
# no cooldown, so only the cast time limits it. The bolt forms in the hands during the cast and flies where the crosshair
# points (RLM-344), homing on an enemy near it (RLM-345). Matěj's rebalance of 2026-11-01 (RLM-572): 8/9/10/11/12 +
# 100/115/130/145/160 % of Spell Power (scaling system C, RLM-534; the highest coefficient per cast, a single-target cast
# with no cooldown), 10/15/20/25/30 mana, and Slowness for 4 s at every rank, I at ranks 1 and 2, II at 3 and 4 and III
# at 5. A level 1 Mage (Stone Wand 2, Apprentice's set 2, Intellect 6 × 0.5) has 7 Spell Power: 15 damage a cast. Its
# hit explodes in ice (RLM-399, Matěj, 2026-10-24): every other enemy within a block of the target takes half the damage
# and the full Slowness.
id: frostbolt
name: {en_us: Frostbolt}
description: {en_us: "Hurls a bolt of frost for {damage} damage that slows the target for {duration} sec."}
school: realmforge:frost
scales_with: spell_power
targeting: {type: realmforge:direction, range: 40}
cast: {type: cast_time, duration_seconds: 1.5}
cost: {resource: realmforge:mana, amount: 10, per_level: 5}
max_level: 5
visuals: {look: realmforge:frost, forming: grow}
effects:
  - type: realmforge:projectile
    speed: 30
    size: 0.5
    model: realmforge:chunk
    splash: {radius: 1, damage_percent: 50}
    effects:
      - type: realmforge:damage
        amount: 8
        per_level: 1
        spell_power_percent: 100
        spell_power_per_level_percent: 15
      - type: realmforge:apply_effect
        effect: minecraft:slowness
        duration_seconds: 4
        stronger_at_levels: [3, 5]
