# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Mage's self-buff (C4), the Frost Mage's tree, row 3 (level 12), middle (RLM-542; the tree's version 1): the Mage
# never heals but survives through shields (Matěj, 2026-10-22). Ice Barrier raises the Magic Shield by 10 / 20 / 30 for
# 10 / 20 / 30 s by rank and fills those points at once, so it shields in the middle of a fight, on a 1 minute cooldown
# (Matěj, 2026-10-30), for 25/35/45 mana (Matěj's playtest of 2026-11-01). Spell power raises nothing of it; Cooldown
# Reduction shortens its cooldown, and a second cast refreshes the barrier instead of stacking it.
id: ice_barrier
name: {en_us: Ice Barrier}
description: {en_us: "Wraps you in ice that raises your Magic Shield by {bonus} for {duration} sec."}
school: realmforge:frost
scales_with: spell_power
targeting: {type: realmforge:self}
cast: {type: instant}
cost: {resource: realmforge:mana, amount: 25, per_level: 10}
cooldown_seconds: 60
max_level: 3
effects:
  - type: realmforge:apply_effect
    effect: realmforge:ice_barrier
    duration_seconds: 10
    duration_per_level_seconds: 10
    stronger_at_levels: [2, 3]
