# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# Astone's rockfall (W5b, RLM-491), from her second phase on: rocks come down where her target stood when she began
# the 2 s cast, with cracking rock as its tell and a ring of dark grey dust marking the spot (BossMob). Step out of the
# ring to dodge it; it punishes standing still at range. Three times its first damage, and 15 % more armor shred and
# magic shield damage on her own 15 % (RLM-580; Matěj, 2026-11-03).
id: astone_rockfall
name: {en_us: Rockfall}
description: {en_us: "Brings rocks down on a spot, dealing {damage} damage to every enemy within {radius} blocks of it."}
school: realmforge:physical
scales_with: attack_damage
targeting: {type: realmforge:ground_point, range: 24}
cast:
  type: cast_time
  duration_seconds: 2
  sound: realmforge:spell.astone_rockfall.crack
cooldown_seconds: 9
npc_only: true
effects:
  - type: realmforge:area
    radius: 3
    duration_seconds: 0.5
    interval_seconds: 0.5
    ring_color: "#8C8C8C"
    effects:
      - {type: realmforge:damage, amount: 15, attack_damage_percent: 75, armor_shred_percent: 15, magic_shield_damage_percent: 15}
