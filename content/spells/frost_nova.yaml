# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Frost Mage's tree, row 2 (level 6), middle (RLM-542; Matěj, 2026-10-30, "Spell Trees to Level 18", chosen for M1):
# an instant ring of frost round the Mage that hits every enemy within 4 blocks and Freezes them (rooted, RLM-539), so
# the Mage can step away or Ice Lance them; any damage ends Frozen at a 50 % chance (content/effects/frozen.yaml).
# Matěj's rebalance of 2026-11-01 (RLM-572): 3/4/5 + 40/50/60 % of Spell Power, Frozen for 6/8/10 s, 30/40/50 mana and a
# cooldown of 20/15/10 s, one of the cooldowns that shrink with the rank. Bosses may be immune to Frozen (RLM-539).
# Placeholder ring until the Frost visuals (RLM-544).
id: frost_nova
name: {en_us: Frost Nova}
description:
  en_us: >-
    Blasts the ground round you with frost, dealing {damage} damage to every enemy within {radius} blocks and freezing
    them in place for {duration} sec.
school: realmforge:frost
scales_with: spell_power
targeting: {type: realmforge:self}
cast: {type: instant}
cost: {resource: realmforge:mana, amount: 30, per_level: 10}
cooldown_seconds: 20
cooldown_per_level_seconds: -5
max_level: 3
effects:
  - type: realmforge:area
    radius: 4
    duration_seconds: 0.5
    interval_seconds: 0.5
    # Lowercase on purpose: either case validates, and every generated file gets it in uppercase, which the content
    # GameTests compare with the colour the game loads (RLM-507).
    ring_color: "#bfefff"
    effects:
      - type: realmforge:damage
        amount: 3
        per_level: 1
        spell_power_percent: 40
        spell_power_per_level_percent: 10
      - type: realmforge:apply_effect
        effect: realmforge:frozen
        duration_seconds: 6
        duration_per_level_seconds: 2
