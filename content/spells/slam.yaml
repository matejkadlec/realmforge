# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Warrior's first spell (C4; Arms's first spell, RLM-392; decision D4's starting spell "a Slam but AoE"): a heavy
# weapon blow, High damage, that ignores 5 % of the target's armor per rank. It needs a melee weapon (RLM-499). An area
# swing (RLM-399): Better Combat's sword swing at the player's melee reach (Matěj's playtest of 2026-10-31), 120° wide,
# every enemy in it taking the same damage, with no target needed; it plays out over a 0.5 s swing and hits at its
# middle. Rage per second of cooldown: 30 / 6 s = 5. Scaling system C (Matěj,
# 2026-10-30, RLM-534): 4/5.5/7/8.5/10 + 120/140/160/180/200 % of Attack Damage.
id: slam
name: {en_us: Slam}
description: {en_us: "Slams every enemy in front of you for {damage} damage, ignoring {armor_shred}% of their armor."}
school: realmforge:physical
scales_with: attack_damage
targeting: {type: realmforge:self}
cast: {type: instant, animation_seconds: 0.5, hit_at_percent: 50}
cost: {resource: realmforge:rage, amount: 30}
cooldown_seconds: 6
max_level: 5
requires: [melee_weapon]
effects:
  - type: realmforge:melee
    shape: swing
    effects:
      - type: realmforge:damage
        amount: 4
        per_level: 1.5
        attack_damage_percent: 120
        attack_damage_per_level_percent: 20
        armor_shred_percent: 5
        armor_shred_per_level_percent: 5
