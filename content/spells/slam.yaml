# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Warrior's first spell (C4; Arms's first spell, RLM-392; decision D4's starting spell "a Slam but AoE"): a heavy
# weapon blow, High damage, that ignores 5 % of the target's armor per rank. It needs a melee weapon (RLM-499). Single
# target, its damage at once, until RLM-399 gives it its sector and C6 its swing (architecture 11.7). Rage per second
# of cooldown: 30 / 6 s = 5. First balance pass (C4): with a Stone Sword at level 1, about 10 damage before armor.
id: slam
name: {en_us: Slam}
description: {en_us: "Slams an enemy for {damage} damage, ignoring {armor_shred}% of its armor."}
school: realmforge:physical
scales_with: attack_damage
targeting: {type: realmforge:enemy, range: 4}
cast: {type: instant}
cost: {resource: realmforge:rage, amount: 30}
cooldown_seconds: 6
max_level: 5
requires: [melee_weapon]
effects:
  - type: realmforge:damage
    amount: 4
    per_level: 1.5
    attack_damage_percent: 120
    armor_shred_percent: 5
    armor_shred_per_level_percent: 5
