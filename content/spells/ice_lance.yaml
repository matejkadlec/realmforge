# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Frost Mage's tree, row 2 (level 6), left (RLM-542; Matěj, 2026-10-30, "Spell Trees to Level 18", chosen for M1,
# version 1): one of the two spells the tree revolves around, so 5 ranks. An instant shard of ice, many times stronger
# against a Frozen target (Frost Nova and Frostbite freeze them, and Shatter adds crit chance against them): slow,
# freeze, then lance. Matěj's rebalance of 2026-11-01 (RLM-572): 4/5/6/7/8 + 45/50/55/60/65 % of Spell Power,
# × 2/2.5/3/3.5/4 against a Frozen target, 15/25/35/45/55 mana and no cooldown (it was 4 s): only the global cooldown
# and the mana pace it. It flies where the crosshair points, as Frostbolt does, homing on an enemy near it (RLM-345).
# Placeholder look until RLM-544.
id: ice_lance
name: {en_us: Ice Lance}
description:
  en_us: "Throws a shard of ice for {damage} damage, {against_damage} damage against a Frozen target."
school: realmforge:frost
scales_with: spell_power
targeting: {type: realmforge:direction, range: 40}
cast: {type: instant}
cost: {resource: realmforge:mana, amount: 15, per_level: 10}
max_level: 5
visuals: {look: realmforge:frost}
effects:
  - type: realmforge:projectile
    speed: 45
    size: 0.3
    model: realmforge:orb
    effects:
      - type: realmforge:damage
        amount: 4
        per_level: 1
        spell_power_percent: 45
        spell_power_per_level_percent: 5
        against_effect:
          effect: realmforge:frozen
          damage_percent: 100
          damage_per_level_percent: 50
