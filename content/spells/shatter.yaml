# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# The Frost Mage's tree, row 3 (level 12), left (Matěj, 2026-10-30, "Spell Trees to Level 18", chosen for M1; RLM-541,
# RLM-542): 10/20/30 % more crit chance for your spells against Frozen targets (Frost Nova and Frostbite freeze them).
# Above 100 % in all it turns into crit damage, as every crit chance does (C4), which its tooltip says (Matěj's
# rebalance of 2026-11-01, RLM-572).
id: shatter
name: {en_us: Shatter}
description:
  en_us: >-
    Your spells have {crit_chance}% more chance to crit against Frozen targets. Crit chance above 100% turns into
    bonus crit damage.
school: realmforge:frost
max_level: 3
passive:
  crit_chance:
    chance_percent: 10
    chance_per_level_percent: 10
    against: realmforge:frozen
