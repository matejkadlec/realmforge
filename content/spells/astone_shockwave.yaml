# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# Astone's shockwave (W5b, RLM-491): as her second phase begins (on_enter), she throws back every enemy near her, with
# no damage, and stands for the phase change. Proposals for Matěj's playtest.
id: astone_shockwave
name: {en_us: Shockwave}
description: {en_us: "Throws back every enemy within {radius} blocks."}
school: realmforge:physical
scales_with: attack_damage
targeting: {type: realmforge:self}
cast: {type: instant}
npc_only: true
effects:
  - type: realmforge:area
    radius: 8
    duration_seconds: 0.5
    interval_seconds: 0.5
    effects:
      - {type: realmforge:knockback, strength: 1.5}
