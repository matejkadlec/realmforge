# yaml-language-server: $schema=../../tools/schemas/spells.schema.json
# Engine test (C3a-2): a free frost bolt with a 1 s cast time that locks on to its target (range and line of sight
# are not checked again) and may be cast while moving. Not gameplay content; the GameTests in the QA mod cast it.
id: test_homing_bolt
name: {en_us: Test Homing Bolt}
description: {en_us: "Sends a frost bolt that follows its target for {damage} damage."}
school: realmforge:frost
scales_with: spell_power
targeting: {type: realmforge:enemy, range: 16}
cast: {type: cast_time, duration_seconds: 1, castable_while_moving: true, lock_on: true}
effects:
  - {type: realmforge:damage, amount: 4}
