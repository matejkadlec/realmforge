# yaml-language-server: $schema=../../tools/schemas/stats.schema.json
# Extra damage of a critical hit, on top of the normal hit (50 means a crit deals 150 %). F5 applies it.
# 150 % for melee, ranged and spell crits alike by default (Matěj, 2026-10-19, RLM-271 playtest).
id: crit_damage
name: {en_us: Crit Damage}
kind: secondary
default_percent: 50
max_percent: 1000
