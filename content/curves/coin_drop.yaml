# yaml-language-server: $schema=../../tools/schemas/curves.schema.json
# What a normal hostile mob drops in coins, by its level, in copper (RLM-286; Matěj, 2026-10-21, ADR 0072): one smooth
# curve, e^(-0.2109 + 0.2113 L - 0.000458 L^2), through about 1 copper at level 1, 1 gold (10000) at level 50 and
# 5 gold at level 60, growing 23 % a level at first and 17 % at the end. A drop is 50 to 150 % of it, times the mob's
# rank (its kill XP multiplier), at least 1 copper, paid in the largest coins; Luck and Looting never change it
# (loot/CoinDrops). A point per level, since the curve bends: between two levels nothing is read. Prices stay fixed, so
# later realms make them feel cheap (ADR 0040); the numbers are tuned after a playtest (docs/design/coins.md).
id: coin_drop
