# yaml-language-server: $schema=../../tools/schemas/curves.schema.json
# The share of kill_xp a kill gives when the victim's level is above the player's, by how many levels it is above
# (the curve's "level" is that difference): 5 % more per level, up to 20 % more from 4 levels above. C2's first
# numbers.
id: kill_xp_above_player
name: {en_us: Kill XP Above Player}
points:
  - {level: 0, value: 1.0}
  - {level: 4, value: 1.2}
