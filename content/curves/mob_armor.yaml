# yaml-language-server: $schema=../../tools/schemas/curves.schema.json
# Armor points a leveled mob gets on top of its own, by its level (architecture 14.1). 0 at level 1 keeps vanilla.
# Our armor formula then blocks armor / (armor + K) of a hit, K at the attacker's level (armor_halving.yaml). W1's
# first numbers, tuned in playtests.
id: mob_armor
name: {en_us: Mob Armor}
points:
  - {level: 1, value: 0}
  - {level: 5, value: 2}
  - {level: 10, value: 4}
  - {level: 20, value: 8}
  - {level: 60, value: 25}
