# yaml-language-server: $schema=../../tools/schemas/curves.schema.json
# Armor points a leveled mob gets on top of its own, by its level (architecture 14.1). 0 at level 1 keeps vanilla.
# Hits then meet vanilla's armor formula (architecture 9.1): the bigger a hit, the less of it armor blocks. W1's
# first numbers, tuned in playtests (RLM-204).
id: mob_armor
name: {en_us: Mob Armor}
points:
  - {level: 1, value: 0}
  - {level: 5, value: 2}
  - {level: 10, value: 4}
  - {level: 20, value: 8}
  - {level: 60, value: 25}
