# yaml-language-server: $schema=../../tools/schemas/curves.schema.json
# The character XP that takes a player from a level to the next (architecture 10.2), from the XP model of
# 2026-10-15 (RLM-192): XP(L) = KE(L) x (45 + 5L), where 45 + 5L is one kill of a mob of the player's level
# (kill_xp) and KE(L) the kills a level takes. KE(1) = 30, about 5 minutes of farming at 6 kills a minute; KE(L + 1) =
# KE(L) x 1.07 below level 10, x 1.05 for 10-17, x 1.035 for 18-29 and x 1.03 from 30. Rounded half up to 10 below
# 10,000 and to 50 from 10,000. A player needs 25,960 XP in all for level 10, 85,890 for 18, 281,690 for 30 and
# 1,912,740 for 60. One point per level, generated from the formula (tools/tests/test_leveling.py recomputes it);
# playtests that measure another farming rate move only KE(1).
id: xp_to_next_level
name: {en_us: XP to Next Level}
points:
  - {level: 1, value: 1500}
  - {level: 2, value: 1770}
