# yaml-language-server: $schema=../../tools/schemas/mobs.schema.json
# Boss framework test (W5a, RLM-490): the body of the test boss realmforge:test_titan (content/bosses/), a stone
# golem that hits in melee and casts its phases' abilities. Not gameplay content; the GameTests in the QA mod fight it.
id: test_titan
name: {en_us: Test Titan}
archetype: boss
size: {width: 1.4, height: 3.2}
attributes:
  max_health: 200
  attack_damage: 6
  armor: 4
  movement_speed: 0.25
  follow_range: 32
  knockback_resistance_percent: 100
melee: {attack_interval_seconds: 1.5}
loot:
  - {item: minecraft:diamond}
model: {build: golem, surface: speckled, eyes: tall, color: "#7D7D86"}
