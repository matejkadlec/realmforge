# yaml-language-server: $schema=../../tools/schemas/realms.schema.json
# Overworld's entry (W2b, realm portal spec, "Data"): no realm, always open, so no unlock, signet, hint or flavour line.
# Its colour is the return portals', the way back from a realm. A way back that finds no portal near the scaled
# position builds one with its bottom row at y 63 to 310, set into the ground: from the first block above the sea's top
# water block (62), so a frame fits into low plains, river banks and shores at y 63, while over deep ocean, where water
# is no floor, it builds on a platform at the surface instead of under the seabed (RLM-157, RLM-341); 310 is vanilla's
# own ceiling for a built portal.
id: overworld
dimension: minecraft:overworld
name:
  en_us: Overworld
colour: "#5DBB63"
arrival:
  y: [63, 310]
  floor: minecraft:stone_bricks
  pocket_radius: 3
