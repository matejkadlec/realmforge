// Dev-only QA mod (mod ID `realmforge_qa`): GameTests and debug tools.
// Depends on the core mod and is NEVER released or added to the modpack.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// The mods { } block below references the core mod's and Better Key Binds' source sets.
evaluationDependsOn(':mod')
evaluationDependsOn(':better-key-binds')

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'realmforge_qa'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main {
    // Generated by tools/ (`uv run rf gen`): content expectations, GameTest structure templates.
    // Committed, never edited by hand.
    java.srcDir 'src/generated/java'
    resources.srcDir 'src/generated/resources'
}

// Gives a fresh dev client our default settings: copies dev/options.txt into the client's game directory, but only
// while it has no options.txt yet, so changes made in game persist. Delete run/client/options.txt to reset.
// Configuration-cache safe: the actions use only the file and provider captured here, never `project`.
def seedDevOptions = tasks.register('seedDevOptions') {
    group = 'realmforge'
    description = 'Copies dev/options.txt into the dev client game directory unless it has an options.txt.'
    def template = rootProject.file('dev/options.txt')
    def target = neoForge.runs.client.gameDirectory.file('options.txt')
    inputs.file(template)
    onlyIf('the dev client has no options.txt yet') { !target.get().asFile.exists() }
    doLast {
        def file = target.get().asFile
        file.parentFile.mkdirs()
        java.nio.file.Files.copy(template.toPath(), file.toPath())
    }
}

// Gives every dev run the pack's config overrides: copies pack/config/ into the run's config/ folder before it starts,
// replacing the files the mods wrote, as packwiz-installer does on every launch of the pack (pack/README.md), so the
// dev runs and the GameTests play with the pack's settings (Apothic Attributes' formulas, RLM-271).
// Configuration-cache safe: the action uses only the folders captured here, never `project`.
def seedPackConfig = tasks.register('seedPackConfig') {
    group = 'realmforge'
    description = 'Copies the pack config overrides (pack/config/) into the config folder of every dev run.'
    def source = rootProject.file('pack/config')
    def targets = ['client', 'server', 'gametest'].collect { rootProject.file("run/${it}/config") }
    inputs.dir(source)
    // A mod may rewrite its file while a run plays, so the copy runs before every launch.
    outputs.upToDateWhen { false }
    doLast {
        def root = source.toPath()
        targets.each { target ->
            java.nio.file.Files.walk(root).withCloseable { paths ->
                paths.filter { java.nio.file.Files.isRegularFile(it) }.forEach { file ->
                    def copy = target.toPath().resolve(root.relativize(file).toString())
                    java.nio.file.Files.createDirectories(copy.parent)
                    java.nio.file.Files.copy(file, copy, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
    }
}

// The dev runs play with the whole pack (RLM-279, ADR 0042): every mod of pack/mods/*.pw.toml at the build the pack
// ships, read from there so the two never drift. A `side = "client"` mod joins the client, a `"server"` one the dev
// server and the GameTest server, a `"both"` one every run, as packwiz-installer sorts them for a player and a server.
// A Modrinth mod comes from Modrinth's Maven by project and version id ([update.modrinth]), a CurseForge one from
// CurseMaven by project and file id ([update.curseforge]); before a run starts, verifyPackMods* checks each jar
// against the hash in its .pw.toml. tools/tests/test_dev_run_mods.py checks that every .pw.toml has what this
// reader needs.
//
// `-PleanClient` starts the client with only the mods in leanClientMods, for quick checks and agents' screenshot
// runs; `-PwithBetterCombat` adds Better Combat and its config library to it: ./gradlew runClient -PleanClient

// Reads the flat TOML packwiz writes: `[section]` headers and `key = value` lines, values as strings.
static Map<String, Map<String, String>> readPackwizToml(File file) {
    Map<String, Map<String, String>> sections = [:]
    def section = ''
    file.eachLine('UTF-8') { line ->
        def header = line.trim() =~ /^\[(.+)]$/
        def entry = line.trim() =~ /^([A-Za-z0-9_-]+)\s*=\s*"?(.*?)"?$/
        if (header.matches()) {
            section = header.group(1)
        } else if (entry.matches()) {
            sections.computeIfAbsent(section) { [:] }[entry.group(1)] = entry.group(2)
        }
    }
    return sections
}

def packMods = rootProject.file('pack/mods').listFiles().findAll { it.name.endsWith('.pw.toml') }.sort { it.name }
        .collect { file ->
            def toml = readPackwizToml(file)
            def slug = file.name - '.pw.toml'
            def side = toml['']?.side
            def modrinth = toml['update.modrinth'] ?: [:]
            def curseforge = toml['update.curseforge'] ?: [:]
            def download = toml['download'] ?: [:]
            if (!(side in ['client', 'server', 'both'])) {
                throw new GradleException("pack/mods/${file.name}: side is '${side}', not client, server or both")
            }
            String coordinate
            if (modrinth['mod-id'] && modrinth.version) {
                coordinate = "maven.modrinth:${modrinth['mod-id']}:${modrinth.version}"
            } else if (curseforge['project-id'] && curseforge['file-id']) {
                coordinate = "curse.maven:${slug}-${curseforge['project-id']}:${curseforge['file-id']}"
            } else {
                throw new GradleException("pack/mods/${file.name}: no [update.modrinth] mod-id and version, and no " +
                        "[update.curseforge] project-id and file-id, so the dev runs cannot download it")
            }
            if (!(download['hash-format'] in ['sha1', 'sha256', 'sha512']) || !download.hash) {
                throw new GradleException("pack/mods/${file.name}: no sha1, sha256 or sha512 hash under [download]")
            }
            [slug: slug, side: side, coordinate: coordinate, hashFormat: download['hash-format'], hash: download.hash]
        }
def packMod = { String slug ->
    def mod = packMods.find { it.slug == slug }
    if (mod == null) {
        throw new GradleException("qa-mod/build.gradle names pack/mods/${slug}.pw.toml, which does not exist")
    }
    return mod
}

// The lean client: GeckoLib, which the core mod requires (its custom mobs, architecture 14.2), Player Animation
// Library, which the QA mod compiles against (dependencies below), and Yeetus Experimentus, which skips the
// experimental-settings warning of every new world (architecture 15.1).
def leanClient = providers.gradleProperty('leanClient').isPresent()
def leanClientMods = ['geckolib', 'player-animation-library', 'yeetus-experimentus']
if (providers.gradleProperty('withBetterCombat').isPresent()) {
    leanClientMods += ['better-combat', 'cloth-config']
}

configurations {
    packClientMods { canBeConsumed = false; transitive = false }
    packServerMods { canBeConsumed = false; transitive = false }
    packLeanClientMods { canBeConsumed = false; transitive = false }
}
packMods.each { mod ->
    if (mod.side != 'server') {
        dependencies.add('packClientMods', mod.coordinate)
    }
    if (mod.side != 'client') {
        dependencies.add('packServerMods', mod.coordinate)
    }
}
leanClientMods.each { dependencies.add('packLeanClientMods', packMod(it).coordinate) }
def clientMods = configurations.named(leanClient ? 'packLeanClientMods' : 'packClientMods')
def serverMods = configurations.named('packServerMods')

// A run's classpath is its source set's runtime classpath, so the client and the servers each get a source set of
// their own (without sources) that adds their pack mods to the QA mod's. ModDevGradle puts its launcher (DevLaunch,
// DevLogin) into the run source set's own runtime classpath configuration, which therefore stays part of it.
// The client also loads Better Key Binds (ADR 0048), which neither Realmforge mod depends on: its classes join the
// client's classpath only, never the QA mod's compile classpath.
def betterKeyBinds = project(':better-key-binds').sourceSets.main
sourceSets {
    devClient {
        runtimeClasspath = sourceSets.main.runtimeClasspath + configurations.devClientRuntimeClasspath +
                files(clientMods) + betterKeyBinds.output
    }
    devServer {
        runtimeClasspath = sourceSets.main.runtimeClasspath + configurations.devServerRuntimeClasspath +
                files(serverMods)
    }
}

// Checks every pack mod jar a run loads against the hash its .pw.toml records, so a run never loads another file
// than packwiz-installer gives a player. Runs again only when the jars change.
// Configuration-cache safe: the action uses only the values captured here, never `project`.
def registerPackModCheck = { String name, configuration ->
    tasks.register(name) {
        group = 'realmforge'
        description = "Checks the jars of ${configuration.name} against the hashes in pack/mods/*.pw.toml."
        // Each jar with its Maven coordinate (group:module:version), as plain values the configuration cache stores.
        def artifacts = configuration.flatMap { it.incoming.artifacts.resolvedArtifacts }.map { results ->
            results.collect { [it.id.componentIdentifier.displayName, it.file] }
        }
        def expected = packMods.collectEntries { [(it.coordinate): [it.slug, it.hashFormat, it.hash]] }
        inputs.files(configuration)
        inputs.property('expected', expected)
        def marker = layout.buildDirectory.file("pack-mods/${name}.txt")
        outputs.file(marker)
        doLast {
            def checked = artifacts.get().collect { coordinate, jar ->
                def (slug, format, hash) = expected[coordinate]
                def algorithm = ['sha1': 'SHA-1', 'sha256': 'SHA-256', 'sha512': 'SHA-512'][format]
                def digest = java.security.MessageDigest.getInstance(algorithm)
                jar.withInputStream { stream ->
                    def buffer = new byte[65536]
                    for (int read = stream.read(buffer); read > 0; read = stream.read(buffer)) {
                        digest.update(buffer, 0, read)
                    }
                }
                def actual = digest.digest().encodeHex().toString()
                if (actual != hash) {
                    throw new GradleException("${jar.name} is not the build pack/mods/${slug}.pw.toml " +
                            "names: its ${format} is ${actual}, the pack's is ${hash}")
                }
                "${slug} ${jar.name}"
            }
            marker.get().asFile.text = checked.sort().join('\n') + '\n'
        }
    }
}
def verifyPackClientMods = registerPackModCheck('verifyPackClientMods', clientMods)
def verifyPackServerMods = registerPackModCheck('verifyPackServerMods', serverMods)

neoForge {
    version = neo_version

    mods {
        realmforge {
            sourceSet project(':mod').sourceSets.main
        }
        realmforge_qa {
            sourceSet sourceSets.main
        }
        // Client only (the server runs' loadedMods leave it out).
        better_key_binds {
            sourceSet betterKeyBinds
        }
    }

    // All dev runs live here and load both mods (core + QA) and the pack's mods for their side; the client also loads
    // Better Key Binds, a client-only mod of this repository (ADR 0048).
    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            taskBefore seedPackConfig
            // A dev run (never a player's game) warns on a loading screen about every mod that still uses @OnlyIn,
            // such as Jade Addons, and waits for a click. The log keeps the warning (OnlyInWarningsHandler).
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }

        client {
            client()
            sourceSet = sourceSets.devClient
            gameDirectory = rootProject.file('run/client')
            taskBefore seedDevOptions
            taskBefore verifyPackClientMods
            // Logs in with a real Minecraft account (covers1624's DevLogin, built into ModDevGradle) instead of
            // the offline `Dev` profile; the first launch prints a Microsoft login link in the console.
            // `-PofflineClient` starts as the offline `Dev` player instead, without the login prompt that an
            // agent's screenshot run cannot answer: ./gradlew runClient -PofflineClient
            devLogin = !providers.gradleProperty('offlineClient').isPresent()
        }

        server {
            server()
            sourceSet = sourceSets.devServer
            loadedMods = [mods.realmforge, mods.realmforge_qa]
            programArgument '--nogui'
            gameDirectory = rootProject.file('run/server')
            taskBefore verifyPackServerMods
        }

        // Headless: starts a GameTest server, runs all GameTests, exits non-zero on failure. It loads the pack's
        // server-side mods like the dev server, so CI catches a collision between them and our code.
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.devServer
            loadedMods = [mods.realmforge, mods.realmforge_qa]
            gameDirectory = rootProject.file('run/gametest')
            taskBefore verifyPackServerMods
        }
    }
}

repositories {
    // Modrinth's Maven endpoint (maven.modrinth.com is an alias of it), only for the `maven.modrinth` group below.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    // CurseMaven serves CurseForge files by project and file id, only for the `curse.maven` group: the pack's
    // CurseForge-only mods (FTB Quests, FTB Library, FTB Teams).
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    implementation project(':mod')

    // Player Animation Library, the animation library Better Combat uses: the QA mod's test cast animation (/qa cast).
    // The pack's build, as every pack mod above; the client and the servers load it as a pack mod as well.
    implementation packMod('player-animation-library').coordinate
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            loader_version_range: loader_version_range,
            mod_license         : mod_license,
            mod_version         : project.version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    filteringCharset = 'UTF-8'
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
