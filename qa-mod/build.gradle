// Dev-only QA mod (mod ID `realmforge_qa`): GameTests and debug tools.
// Depends on the core mod and is NEVER released or added to the modpack.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// The mods { } block below references the core mod's source set.
evaluationDependsOn(':mod')

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'realmforge_qa'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main {
    // Generated by tools/ (`uv run rf gen`): content expectations, GameTest structure templates.
    // Committed, never edited by hand.
    java.srcDir 'src/generated/java'
    resources.srcDir 'src/generated/resources'
}

// Gives a fresh dev client our default settings: copies dev/options.txt into the client's game directory, but only
// while it has no options.txt yet, so changes made in game persist. Delete run/client/options.txt to reset.
// Configuration-cache safe: the actions use only the file and provider captured here, never `project`.
def seedDevOptions = tasks.register('seedDevOptions') {
    group = 'realmforge'
    description = 'Copies dev/options.txt into the dev client game directory unless it has an options.txt.'
    def template = rootProject.file('dev/options.txt')
    def target = neoForge.runs.client.gameDirectory.file('options.txt')
    inputs.file(template)
    onlyIf('the dev client has no options.txt yet') { !target.get().asFile.exists() }
    doLast {
        def file = target.get().asFile
        file.parentFile.mkdirs()
        java.nio.file.Files.copy(template.toPath(), file.toPath())
    }
}

// Gives every dev run the pack's config overrides: copies pack/config/ into the run's config/ folder before it starts,
// replacing the files the mods wrote, as packwiz-installer does on every launch of the pack (pack/README.md), so the
// dev runs and the GameTests play with the pack's settings (Apothic Attributes' formulas, RLM-271).
// Configuration-cache safe: the action uses only the folders captured here, never `project`.
def seedPackConfig = tasks.register('seedPackConfig') {
    group = 'realmforge'
    description = 'Copies the pack config overrides (pack/config/) into the config folder of every dev run.'
    def source = rootProject.file('pack/config')
    def targets = ['client', 'server', 'gametest'].collect { rootProject.file("run/${it}/config") }
    inputs.dir(source)
    // A mod may rewrite its file while a run plays, so the copy runs before every launch.
    outputs.upToDateWhen { false }
    doLast {
        def root = source.toPath()
        targets.each { target ->
            java.nio.file.Files.walk(root).withCloseable { paths ->
                paths.filter { java.nio.file.Files.isRegularFile(it) }.forEach { file ->
                    def copy = target.toPath().resolve(root.relativize(file).toString())
                    java.nio.file.Files.createDirectories(copy.parent)
                    java.nio.file.Files.copy(file, copy, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
    }
}

neoForge {
    version = neo_version

    // All dev runs live here and load both mods (core + QA).
    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            taskBefore seedPackConfig
        }

        client {
            client()
            gameDirectory = rootProject.file('run/client')
            taskBefore seedDevOptions
            // Logs in with a real Minecraft account (covers1624's DevLogin, built into ModDevGradle) instead of
            // the offline `Dev` profile; the first launch prints a Microsoft login link in the console.
            // `-PofflineClient` starts as the offline `Dev` player instead, without the login prompt that an
            // agent's screenshot run cannot answer: ./gradlew runClient -PofflineClient
            devLogin = !providers.gradleProperty('offlineClient').isPresent()
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = rootProject.file('run/server')
        }

        // Headless: starts a GameTest server, runs all GameTests, exits non-zero on failure.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = rootProject.file('run/gametest')
        }
    }

    mods {
        realmforge {
            sourceSet project(':mod').sourceSets.main
        }
        realmforge_qa {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Modrinth's Maven endpoint (maven.modrinth.com is an alias of it), only for the `maven.modrinth` group below.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

// The builds the modpack ships, by Modrinth version id: each id is the `version` under [update.modrinth] in
// pack/mods/<slug>.pw.toml. An id never changes, while a version number can be edited by its author. Update them
// together with the pack; tools/tests/test_qa_mod_dependencies.py fails while one differs. Spike 4, ADR 0020.
def playerAnimationLib = 'maven.modrinth:player-animation-library:QmAdOGjK' // 1.2.8+26.1
def betterCombat = 'maven.modrinth:better-combat:YPa9bdAg' // 3.2.2+26.1.2-neoforge
def clothConfig = 'maven.modrinth:cloth-config:TimoYzse' // 26.1.154+neoforge
def yeetusExperimentus = 'maven.modrinth:yeetus-experimentus:Vw0Mo4mX' // 99.0.0
def placebo = 'maven.modrinth:placebo:c4uzJQYp' // 26.1.2-10.0.2
def apothicAttributes = 'maven.modrinth:apothic-attributes:lLLTcZXk' // 26.1.2-3.1.0
def apothicEnchanting = 'maven.modrinth:apothic-enchanting:5yksP3X6' // 26.1.2-2.1.0
def apotheosis = 'maven.modrinth:apotheosis:EXaIH7Xm' // 26.1.2-9.1.0
def enchantmentDescriptions = 'maven.modrinth:enchantment-descriptions:MMZecuPQ' // 26.1.2.6
def prickle = 'maven.modrinth:prickle:FzfKD3xX' // 26.1.2.6

dependencies {
    implementation project(':mod')

    // Player Animation Library, the animation library Better Combat uses: the QA mod's test cast animation (/qa cast).
    implementation playerAnimationLib

    // Yeetus Experimentus skips the experimental-settings warning that our data pack dimensions cause on every new
    // world, as it does in the pack (architecture 15.1, RLM-84). Its mixins are client-only, so the server and
    // GameTest runs load it without effect.
    runtimeOnly yeetusExperimentus

    // Apotheosis with Apothic Attributes, Apothic Enchanting and their library Placebo, as in the pack (RLM-271): every
    // dev run and the GameTests play with them, so the GameTests check our combat with Apothic Attributes' crit and
    // dodge switched off (compat/apothic_attributes, ApothicAttributesGameTests).
    runtimeOnly placebo
    runtimeOnly apothicAttributes
    runtimeOnly apothicEnchanting
    runtimeOnly apotheosis

    // Enchantment Descriptions and its config library Prickle, as in the pack: the description texts that Apothic
    // Enchanting shows under each enchantment come from it (RLM-271). Its mod and mixins are client-only, so the
    // server and GameTest runs load it without effect.
    runtimeOnly enchantmentDescriptions
    runtimeOnly prickle

    // Better Combat and its config library join the dev runs only with `-PwithBetterCombat`, so the default runs
    // and CI test the mods without it: ./gradlew runClient -PwithBetterCombat
    if (providers.gradleProperty('withBetterCombat').isPresent()) {
        runtimeOnly betterCombat
        runtimeOnly clothConfig
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            loader_version_range: loader_version_range,
            mod_license         : mod_license,
            mod_version         : project.version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    filteringCharset = 'UTF-8'
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
