[project]
name = "realmforge-tools"
version = "0.0.1"
description = "Realmforge content pipeline: validates content/ and generates assets, data and Java registrations."
readme = "tools/README.md"
license = "LicenseRef-All-Rights-Reserved"
requires-python = ">=3.12"
dependencies = [
    # Reads .schem and .litematic rooms and renders the room gallery (rf rooms). Pinned exactly: its API moves
    # between minor versions, and its README does not match the released API (RLM-119).
    "nucleation==0.10.24",
    "pydantic>=2.12,<3",
    "ruamel.yaml>=0.18,<0.20",
]

[project.scripts]
rf = "realmforge_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "realmforge_tools"
module-root = "tools"

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
# pytest-xdist runs the tests on one worker per CPU (four on GitHub's runners), at most eight, so CI's content job stays
# well under its timeout (RLM-605). `-n 0` runs them in this process, for a debugger or `-s` output.
addopts = "-ra --strict-markers -n auto --maxprocesses=8"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Line length is enforced by `ruff format`; long comments and docstrings are fine.
ignore = ["E501"]
