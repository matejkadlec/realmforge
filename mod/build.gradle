plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'realmforge'
}

// Mojang ships Java 25 to end users since 26.1, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main {
    // Generated from content/ by tools/ (`uv run rf gen`). Committed, never edited by hand.
    java.srcDir 'src/generated/java'
    resources.srcDir 'src/generated/resources'
}

neoForge {
    version = neo_version

    // No runs here on purpose: all runs live in qa-mod/ and load both mods,
    // so `./gradlew runClient` from the root starts exactly one client.

    mods {
        realmforge {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.realmforge
    }
}

repositories {
    // Modrinth's Maven endpoint, only for the `maven.modrinth` group: the optional integrations compile against the
    // pack's builds of their mods (architecture 19.4).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

// The Modrinth coordinate of the build the pack ships of pack/mods/<slug>.pw.toml, from its [update.modrinth] mod-id
// and version, so an integration always compiles against the build players run. The dev runs load the same jar as a
// pack mod (qa-mod/build.gradle).
def packModrinthMod = { String slug ->
    def file = rootProject.file("pack/mods/${slug}.pw.toml")
    def section = ''
    def fields = [:]
    file.eachLine('UTF-8') { line ->
        def header = line.trim() =~ /^\[(.+)]$/
        def entry = line.trim() =~ /^([A-Za-z0-9_-]+)\s*=\s*"?(.*?)"?$/
        if (header.matches()) {
            section = header.group(1)
        } else if (entry.matches() && section == 'update.modrinth') {
            fields[entry.group(1)] = entry.group(2)
        }
    }
    if (!fields['mod-id'] || !fields.version) {
        throw new GradleException("pack/mods/${slug}.pw.toml: no [update.modrinth] mod-id and version")
    }
    return "maven.modrinth:${fields['mod-id']}:${fields.version}"
}

dependencies {
    // Optional integrations (compat/, client/compat/): compiled against, never bundled; each runs only when its mod
    // is loaded. Neat draws the mob's card, Jade the tooltip at the top of the screen (RLM-338).
    compileOnly packModrinthMod('neat')
    compileOnly packModrinthMod('jade')

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Tests that check every generated file of a kind list them here (DungeonPlannerTest: every dungeon type). The
    // folder is a resource folder of the main source set, so its files are already inputs of this task.
    systemProperty 'realmforge.generatedResources', file('src/generated/resources').absolutePath
}

// Expands ${...} properties in src/main/templates (neoforge.mods.toml).
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_license            : mod_license,
            mod_version            : project.version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    filteringCharset = 'UTF-8'
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE_realmforge' }
    }
    from(rootProject.file('LICENSE-ASSETS')) {
        rename { 'LICENSE-ASSETS_realmforge' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// NeoForge's own classes (events, attachments, registries) are not part of the game sources since 26.1; they ship as
// the sources jar of the neoforge artifact.
def neoForgeSourcesJar = configurations.create('neoForgeSources') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
dependencies {
    neoForgeSources "net.neoforged:neoforge:${neo_version}:sources"
}

// Unpacks the decompiled Minecraft sources (official names: unobfuscated since 26.1, with NeoForge's patches) and
// NeoForge's own sources into build/mc-sources/ so they can be searched. Verify every Minecraft/NeoForge API there
// instead of guessing (see CLAUDE.md).
tasks.register('extractMinecraftSources', Sync) {
    group = 'realmforge'
    description = 'Unpacks Minecraft + NeoForge sources into build/mc-sources/ for searching.'
    def archives = project.services.get(ArchiveOperations)
    from(tasks.named('createMinecraftArtifacts').flatMap { it.gameSourcesArtifact }.map { archives.zipTree(it) })
    // Only NeoForge's classes: its jar also carries resources that the game sources already hold.
    from(neoForgeSourcesJar.incoming.files.elements.map { jars -> jars.collect { archives.zipTree(it.asFile) } }) {
        include 'net/neoforged/**'
    }
    into rootProject.file('build/mc-sources')
}

// Copies the release jar into a Prism Launcher instance for playtesting.
// Set `realmforge.prismModsDir` in ~/.gradle/gradle.properties (see docs/dev-setup.md).
tasks.register('installToPrism', Copy) {
    group = 'realmforge'
    description = 'Copies the realmforge jar into the Prism Launcher instance mods folder (realmforge.prismModsDir).'
    def modsDir = providers.gradleProperty('realmforge.prismModsDir')
    from tasks.named('jar')
    into modsDir.orElse(layout.buildDirectory.dir('prism-mods-dir-not-set').get().asFile.path)
    doFirst {
        if (!modsDir.isPresent()) {
            throw new GradleException('Set realmforge.prismModsDir in ~/.gradle/gradle.properties (see docs/dev-setup.md).')
        }
        // Remove previously installed realmforge jars so only one version is loaded.
        new File(modsDir.get()).listFiles()?.findAll { it.name ==~ /realmforge-.*\.jar/ }?.each { it.delete() }
    }
}
