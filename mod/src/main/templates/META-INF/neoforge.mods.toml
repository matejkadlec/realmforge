# Mod metadata. Dollar-brace placeholders are expanded from gradle.properties by the generateModMetadata Gradle task.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
# Code: MPL-2.0, assets: CC BY 4.0 (see LICENSE and LICENSE-ASSETS in the repository root)
license = "${mod_license}"
issueTrackerURL = "https://github.com/matejkadlec/realmforge/issues"

[[mods]]
modId = "realmforge"
version = "${mod_version}"
displayName = "Realmforge"
authors = "Matěj Kadlec"
displayURL = "https://github.com/matejkadlec/realmforge"
description = '''
An RPG overhaul inspired by World of Warcraft: Wrath of the Lich King.
'''

# Applied by FML when the game loads (architecture 19.3); ModDevGradle applies the same file for compiling.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.realmforge]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.realmforge]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Apotheosis's attribute library: compat/apothic_attributes switches its crit and dodge off when it is loaded
# (architecture 19.4). The pack ships it; the core mod runs without it.
[[dependencies.realmforge]]
modId = "apothic_attributes"
type = "optional"
versionRange = "[3.1.0,)"
ordering = "NONE"
side = "BOTH"

# Our data overrides some of Apotheosis's and Apothic Enchanting's (architecture 19.4): loading after them puts our
# data pack above theirs, so our files win.
[[dependencies.realmforge]]
modId = "apotheosis"
type = "optional"
versionRange = "[9.1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.realmforge]]
modId = "apothic_enchanting"
type = "optional"
versionRange = "[2.1.0,)"
ordering = "AFTER"
side = "BOTH"

# The mob level in Neat's card above a mob and in Jade's tooltip (RLM-338, architecture 19.4): each integration runs
# only when its mod is loaded.
[[dependencies.realmforge]]
modId = "neat"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies.realmforge]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# Blocking with a two-handed weapon (RLM-297, architecture 9.3): compat/bettercombat puts every weapon Better Combat
# calls two-handed into Sword Blocking Mechanics' item tag. Loading after Sword Blocking Mechanics puts our data pack
# above its own, so our tag file replaces its default (all swords).
[[dependencies.realmforge]]
modId = "bettercombat"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

[[dependencies.realmforge]]
modId = "swordblockingmechanics"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Pick Up Notifier's list of pickups starts mid-screen at the right edge (RLM-308, architecture 19.4).
[[dependencies.realmforge]]
modId = "pickupnotifier"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

# stats/AttributeCaps raises vanilla's attribute caps through a mixin accessor (architecture 8.4, 19.3).
[[mixins]]
config = "realmforge.mixins.json"
