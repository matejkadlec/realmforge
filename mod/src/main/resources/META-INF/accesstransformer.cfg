# Access transformers of the core mod (architecture 19.3): a last resort where no event or API exists. FML applies
# them when the game loads (listed under [[accessTransformers]] in neoforge.mods.toml); ModDevGradle applies them to
# the Minecraft jar we compile against.

# combat/DamagePipeline: a spell school hit restores the defender's lastHurt, which vanilla overwrites, so it leaves the
# hurt cooldown window as it was (architecture 9.1). Tested by the QA mod's CombatGameTests.
public net.minecraft.world.entity.LivingEntity lastHurt

# world/realm/RealmAccess: a player's shoulder entities (a parrot) stay in the level they leave on a trip into or out
# of a realm, and at a death in one; vanilla's own removeEntitiesOnShoulder does nothing within 20 ticks of a landing
# (realm portal spec, "Multiplayer"). Tested by the QA mod's RealmGameTests.
public net.minecraft.server.level.ServerPlayer setShoulderEntityLeft(Lnet/minecraft/nbt/CompoundTag;)V
public net.minecraft.server.level.ServerPlayer setShoulderEntityRight(Lnet/minecraft/nbt/CompoundTag;)V

# compat/bettercombat/TwoHandedWeapons: Better Combat decides at run time which weapons are two-handed, so Sword Blocking
# Mechanics' tag of raisable weapons is bound into the items' holders then, the way MappedRegistry binds tags
# (architecture 9.3). Tested by the QA mod's WeaponBlockGameTests.
public net.minecraft.core.Holder$Reference bindTags(Ljava/util/Collection;)V
