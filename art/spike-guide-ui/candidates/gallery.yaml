# Labels, prompts, seeds and costs for the guide UI spike (round 1: RLM-127, round 2: RLM-131, RD Pro: RLM-134; for
# the decision RLM-116). Generated through the Retro Diffusion MCP server: round 1 on 2026-10-12 (0.42 USD), round 2
# on 2026-10-13 (frame_r2/, 0.12 USD), the RD Pro version of round 2's frame d on 2026-10-13 (frame_pro/, 0.36 USD).
# frame/ and icon_*/ hold the generator output exactly as returned. preview_*/ are derived from two frames (no
# generation cost): see ../README.md for how they were cut. The schema is the one `rf art gallery` reads, but that
# command cleans every candidate at one width and cannot render this mixed-size folder (README, "Pipeline notes").
title: Guide UI art spike
intro: >-
  A pixel-art version of the "modern fantasy hybrid" guide window (dark navy panel, thin gold ornate border,
  decorated corners, a gold crest on the top edge). First the RD Pro version of round 2's frame d, which Matěj
  picked: one RD Pro edit of d and one RD Pro frame drawn from d and the mockup composite. Then round 2: four RD
  Fast frames guided by a clean, symmetric frame built from the mockup's own parts. Then round 1: frames from RD
  Fast and RD Plus, two frames guided by a crop of the mockup's corner, nine-slice and stretched previews, and five
  16x16 category icons, which Matěj accepted. Pick the RD Pro frame for the guide.
candidates:
  rd-pro-edit:
    label: RD Pro edit of d
    note: >-
      rd_pro__edit, 256x184, input_image ../reference/frame-d-256.png, reference_images
      ../reference/frame-composite-256.png, seed 2301, remove_bg; 0.18 USD
  rd-pro-default:
    label: RD Pro from d and the mockup
    note: >-
      rd_pro__default, 256x184, reference_images ../reference/frame-d-256.png and
      ../reference/frame-composite-256.png, seed 2301, remove_bg; 0.18 USD
  rd-fast-a:
    label: RD Fast, round 2 a
    note: >-
      ui_element:rd_flux, 384x272, input_image ../reference/frame-composite.png, strength 0.45, seed 2201,
      remove_bg; 0.03 USD
  rd-fast-b:
    label: RD Fast, round 2 b
    note: >-
      ui_element:rd_flux, 384x272, input_image ../reference/frame-composite.png, strength 0.6, seed 2201, remove_bg;
      0.03 USD
  rd-fast-c:
    label: RD Fast, round 2 c
    note: >-
      ui_element:rd_flux, 384x272, input_image ../reference/frame-composite.png, strength 0.6, seed 2202, remove_bg;
      0.03 USD
  rd-fast-d:
    label: RD Fast, round 2 d (mockup palette)
    note: >-
      ui_element:rd_flux, 384x272, input_image ../reference/frame-composite.png, input_palette
      ../reference/frame-palette.png, strength 0.6, seed 2201, remove_bg; 0.03 USD
  rd-fast-2101:
    label: RD Fast, seed 2101
    note: ui_element:rd_flux (RD Fast UI Element), 256x256, remove_bg; 0.03 USD
  rd-fast-2102:
    label: RD Fast, seed 2102
    note: ui_element:rd_flux (RD Fast UI Element), 256x256, remove_bg; 0.03 USD
  rd-plus-2101:
    label: RD Plus, seed 2101
    note: rd_plus__ui_element, 256x256, remove_bg; 0.06 USD
  rd-plus-2102:
    label: RD Plus, seed 2102
    note: rd_plus__ui_element, 256x256, remove_bg; 0.06 USD
  rd-fast-img2img:
    label: RD Fast, mockup corner as input
    note: >-
      ui_element:rd_flux, 256x256, input_image ../reference/corner-crop.png, strength 0.6, seed 2101, remove_bg;
      0.03 USD
  rd-plus-img2img:
    label: RD Plus, mockup corner as input
    note: >-
      rd_plus__ui_element, 256x256, input_image ../reference/corner-crop.png, strength 0.6, seed 2101, remove_bg;
      0.06 USD
  rd-fast:
    label: RD Fast MC Item
    note: rd_fast__mc_item, 16x16, seed 2101, automatic transparency; 0.03 USD each
subjects:
  frame_pro:
    # Two prompts, one per style. rd-pro-edit: "Keep the exact same composition, size and layout of this game window
    # frame. Redraw it as crisp, clean pixel art: a thin bright gold beveled border line, sharp 45-degree cut corners
    # decorated with fine gold filigree flourishes like the reference, the pointed gold crest with a small blue
    # crystal centered on the top edge, the small gold ornament centered on the bottom edge, small gold diamond
    # studs at the middle of the left and right sides, and a flat very dark navy, almost black, empty panel with no
    # text. Perfectly symmetrical, straight edges, plain white background outside the frame."
    title: Window frame, RD Pro version of round 2's d, 256x184
    prompt: >-
      (rd-pro-default) an empty wide horizontal fantasy RPG game window frame seen straight on, exactly like the
      reference images: a flat very dark navy, almost black, empty rectangular panel framed by a thin bright gold
      beveled border line, sharp 45-degree cut corners with fine gold filigree flourishes, a pointed gold crest with
      a small blue crystal centered on the top edge, a small gold ornament centered on the bottom edge, small gold
      diamond studs at the middle of the left and right sides; no text; perfectly symmetrical, straight edges, on a
      plain white background
  frame_r2:
    title: Window frame, round 2, 384x272 (guided by the mockup frame)
    prompt: >-
      an empty wide horizontal fantasy RPG game window frame seen straight on: a very dark navy blue, almost black,
      rectangular panel framed by a thin bright gold beveled border line, chamfered corners with fine gold filigree
      flourishes, a pointed gold crest with a small blue crystal centered on the top edge, a small gold ornament
      centered on the bottom edge, small gold diamond studs at the middle of the left and right sides; the panel is
      plain and empty with no text; symmetrical, straight edges, on a plain white background
  frame:
    title: Window frame, round 1, 256x256
    prompt: >-
      an empty fantasy RPG game window panel seen straight on, filling the image: a dark navy blue to charcoal
      rectangular panel framed by a thin ornate gold filigree border, decorated gold corner pieces, and a small gold
      crest ornament centered on the top edge; the inside of the panel is plain dark navy with no text;
      symmetrical, straight edges, on a plain white background
  preview_nine_slice:
    # A nine_slice sprite cut from the frame (cropped to its opaque bounding box): the corners, one 8-pixel strip
    # per edge and an 8x8 center block as the regions between the borders, tiled to 400x240 as 1.21.1
    # GuiGraphics#blitNineSlicedSprite tiles them; the crest cut out and drawn centered on the top edge.
    # rd-fast-2102: border 40 on all sides, strips right next to the corners, crest box (112,40)-(150,60).
    # rd-plus-2101: border left 36, top 44, right 36, bottom 36, strips 20 pixels from the corners (the first
    # pixels after each corner hold a stud), crest box (104,12)-(152,56).
    title: Preview, nine-slice at 400x240 (derived from the frame, no cost)
  preview_stretched:
    # The cropped frame scaled to 400x240 with nearest-neighbour sampling.
    title: Preview, stretched to 400x240 (derived from the frame, no cost)
  icon_realms:
    title: Icon, realms (a swirling portal)
    prompt: >-
      a swirling magic portal drawn with thin gold lines: a round gold spiral ring curling inward, outline only, no
      fill, on a plain white background
  icon_dungeons:
    title: Icon, dungeons (a dungeon key)
    prompt: >-
      an old dungeon key drawn with thin gold lines: a round ornate bow, a long shaft and a toothed bit, held
      diagonally, outline only, on a plain white background
  icon_bosses:
    title: Icon, bosses (a horned skull)
    prompt: >-
      a horned skull seen from the front, drawn with thin gold lines: a skull with dark eye sockets and two curved
      horns, outline only, on a plain white background
  icon_basics:
    title: Icon, basics (an open book)
    prompt: >-
      an open book seen from the front, drawn with thin gold lines: two open pages with a center spine, outline
      only, on a plain white background
  icon_locked:
    title: Icon, locked (a padlock)
    prompt: >-
      a closed padlock seen from the front, drawn with thin gold lines: a rounded shackle on top of a square body
      with a keyhole, outline only, on a plain white background
