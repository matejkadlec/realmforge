# Import rules for Moog's Voyager Structures 5.1.3 (LGPL-3.0), A4c (RLM-120). Source and command: ../README.md.
# The source folder merges the jar's data/mvs/structure/1_21_0/cathedral and 1_21_9/cathedral, the newer on top,
# as the mod's 26.1.2 template pools use them. The rooms: the corridors, corners, junctions, stairs and dead ends of
# the crypt under the cathedral, and the crypt's bottom room. Left out: the cathedral itself (45 x 32 x 38, above
# ground) and the blocker that caps an unused doorway. The mod's other structures are surface buildings and nature.
include:
  - cathedral/*
exclude:
  - cathedral/base/base.nbt
  - cathedral/blocker/*
max_size: 32
blocks:
  minecraft:structure_block: minecraft:air[]  # leftovers of the authoring world
jigsaws:
  interior: drop
  normalize: true
loot_tables:
  mvs:*: null         # the dungeon fills its chests (W4); vanilla tables stay
entities:
  keep: [minecraft:painting, minecraft:item_frame, minecraft:glow_item_frame, minecraft:armor_stand]
