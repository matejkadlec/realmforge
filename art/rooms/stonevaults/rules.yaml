# Import rules for Stonevaults 2.0.0+26.1-neoforge (MIT), A4c (RLM-120). Source and command: ../README.md.
# The rooms: the zombie and pillager dungeons' entrances, lobbies, rooms, stairways and treasure rooms. Left out: the
# igloo and the mage tower (surface buildings), the illager pieces (a mob on a 1x3x1 jigsaw stub) and the zombie
# temple's blockers (5x3x3 caps the temple pulls in).
include:
  - dungeon/*
  - pillager_dungeon/*
exclude:
  - pillager_dungeon/illagers/*
  - dungeon/rooms/zombie_three_way_temple/*
max_size: 32
blocks:
  minecraft:chain: minecraft:iron_chain       # renamed in 1.21.9; the templates are from 1.17
  minecraft:structure_block: minecraft:air[]  # leftovers of the authoring world (save blocks, data markers)
jigsaws:
  interior: drop      # mob and blocker stubs inside the rooms
  normalize: true
loot_tables:
  stonevaults:*: null # the dungeon fills its chests (W4)
entities:
  keep: [minecraft:painting, minecraft:item_frame, minecraft:glow_item_frame, minecraft:armor_stand]
place:
  # The fall cushion (RLM-276): a player who drops down the entrance shaft (the entrance, then any stack of the
  # stairway's fall rooms) lands in lobby_01, the one room under it, below its 3x3 ceiling hole. Its floor there
  # becomes waterlogged stone brick bottom slabs, so a drop of any height deals no fall damage; the floor around
  # holds the water in, and a bottom slab's whole underside keeps it from flowing down. A rim of waterlogged stone
  # brick stairs reaches one block past the hole on every side, their tall half outward and L-shaped in the corners
  # (Matěj's 5x5, 2026-10-22): a player who holds a direction while falling leaves the shaft's wall once below the
  # ceiling and drifts a little outward, and lands on a stair's low half, in its water. Only a landing on the tall
  # half deals damage. The corners are the shapes StairBlock gives this ring itself, so no block update reshapes them.
  dungeon/lobby/lobby_01:
    - {from: [5, 0, 5], to: [7, 0, 7], block: "minecraft:stone_brick_slab[type=bottom,waterlogged=true]"}
    - {from: [5, 0, 4], to: [7, 0, 4], block: "minecraft:stone_brick_stairs[facing=north,half=bottom,shape=straight,waterlogged=true]"}
    - {from: [5, 0, 8], to: [7, 0, 8], block: "minecraft:stone_brick_stairs[facing=south,half=bottom,shape=straight,waterlogged=true]"}
    - {from: [4, 0, 5], to: [4, 0, 7], block: "minecraft:stone_brick_stairs[facing=west,half=bottom,shape=straight,waterlogged=true]"}
    - {from: [8, 0, 5], to: [8, 0, 7], block: "minecraft:stone_brick_stairs[facing=east,half=bottom,shape=straight,waterlogged=true]"}
    - {from: [4, 0, 4], to: [4, 0, 4], block: "minecraft:stone_brick_stairs[facing=north,half=bottom,shape=inner_left,waterlogged=true]"}
    - {from: [8, 0, 4], to: [8, 0, 4], block: "minecraft:stone_brick_stairs[facing=north,half=bottom,shape=inner_right,waterlogged=true]"}
    - {from: [4, 0, 8], to: [4, 0, 8], block: "minecraft:stone_brick_stairs[facing=south,half=bottom,shape=inner_right,waterlogged=true]"}
    - {from: [8, 0, 8], to: [8, 0, 8], block: "minecraft:stone_brick_stairs[facing=south,half=bottom,shape=inner_left,waterlogged=true]"}
  # Matěj's playtest of 2026-10-24 (RLM-364): no pooled room may lock players in or keep its chests out of reach.
  # The zombie temple's iron doors had a button outside only, so a player who walked in could not walk out: a button
  # inside each, on the wall block its outer button powers.
  dungeon/rooms/zombie_three_way_temple:
    - {from: [2, 2, 5], to: [2, 2, 5], block: "minecraft:stone_button[face=wall,facing=east,powered=false]"}
    - {from: [10, 2, 7], to: [10, 2, 7], block: "minecraft:stone_button[face=wall,facing=west,powered=false]"}
  # The husk temple's doorways were barred (iron bars around a 1x1 gap, its connectors leaving iron bars in the gap),
  # though the dungeon passes through it. Its spawner sat sealed inside the sandstone monument in the middle; players
  # break spawners in instances (RLM-412), so the monument is opened on its east side above its bottom layer (Matěj,
  # 2026-10-24): the spawner keeps the sandstone around it at floor level and shows from above and from the east.
  dungeon/rooms/husk_temple:
    - {from: [0, 1, 6], to: [0, 1, 6], final_state: "minecraft:air"}
    - {from: [12, 1, 6], to: [12, 1, 6], final_state: "minecraft:air"}
    - {from: [0, 1, 5], to: [0, 3, 5], block: "minecraft:air"}
    - {from: [0, 2, 6], to: [0, 3, 6], block: "minecraft:air"}
    - {from: [0, 1, 7], to: [0, 3, 7], block: "minecraft:air"}
    - {from: [12, 1, 5], to: [12, 3, 5], block: "minecraft:air"}
    - {from: [12, 2, 6], to: [12, 3, 6], block: "minecraft:air"}
    - {from: [12, 1, 7], to: [12, 3, 7], block: "minecraft:air"}
    - {from: [7, 2, 5], to: [7, 2, 7], block: "minecraft:air"}
    - {from: [6, 2, 6], to: [6, 3, 6], block: "minecraft:air"}
  # The skeleton trap's spawner sat under a 3x3 of stone brick slabs: the slab above it becomes a cobweb, which shows
  # the spawner and which players break, like the spawner (Matěj, 2026-10-24, RLM-412).
  dungeon/rooms/skeleton_trap:
    - {from: [6, 2, 6], to: [6, 2, 6], block: "minecraft:cobweb"}
  # The jail's garden behind tinted glass (grass, a small house with a bed) is a sight: its iron door, which nothing
  # opened, becomes tinted glass too.
  pillager_dungeon/rooms/jail:
    - {from: [8, 1, 10], to: [8, 2, 10], block: "minecraft:tinted_glass"}
    # The far end of its passage beside the garden always holds a chest and a barrel on its side, its lid to the
    # passage, and the room no other container (Matěj, 2026-10-25).
    - {from: [10, 1, 11], to: [10, 1, 11], block: "minecraft:chest[facing=north,type=single,waterlogged=false]"}
    - {from: [11, 1, 11], to: [11, 1, 11], block: "minecraft:barrel[facing=north,open=false]"}
  # The cells of jail_2 hold chests behind iron doors that nothing opened: a lever above each door on both sides,
  # on the wall block over it, so nobody is locked in a cell.
  pillager_dungeon/rooms/jail_2:
    - {from: [4, 3, 5], to: [4, 3, 5], block: "minecraft:lever[face=wall,facing=south,powered=false]"}
    - {from: [8, 3, 5], to: [8, 3, 5], block: "minecraft:lever[face=wall,facing=south,powered=false]"}
    - {from: [4, 3, 3], to: [4, 3, 3], block: "minecraft:lever[face=wall,facing=north,powered=false]"}
    - {from: [8, 3, 3], to: [8, 3, 3], block: "minecraft:lever[face=wall,facing=north,powered=false]"}
    - {from: [4, 3, 7], to: [4, 3, 7], block: "minecraft:lever[face=wall,facing=north,powered=false]"}
    - {from: [8, 3, 7], to: [8, 3, 7], block: "minecraft:lever[face=wall,facing=north,powered=false]"}
    - {from: [4, 3, 9], to: [4, 3, 9], block: "minecraft:lever[face=wall,facing=south,powered=false]"}
    - {from: [8, 3, 9], to: [8, 3, 9], block: "minecraft:lever[face=wall,facing=south,powered=false]"}
  # The egg treasury ends the test dungeon's run (RLM-363): its exit marker, where the builder lays the Dungeon Exit,
  # stands against the east wall, opposite the doorway; the dressing puts no barrels in this room, so nothing stands
  # in front of it.
  dungeon/treasure/egg:
    - {from: [11, 2, 6], to: [11, 2, 6], marker: exit}
dress:
  exclude: [dungeon/entrances/*]  # approved as they are
  # Variety and decorations Matěj asked for in the gallery review (2026-10-14): the plainer a room, the more it
  # gets (tools/realmforge_tools/rooms/dress.py). There is no cracked mossy stone brick block; mossy cobblestone
  # takes its place.
  floor:
    target: 4
    replace: [minecraft:cobblestone, minecraft:stone_bricks, minecraft:stone]
    variants: [minecraft:mossy_cobblestone, minecraft:cracked_stone_bricks, minecraft:gravel]
  walls:
    target: 4
    replace: [minecraft:stone_bricks, minecraft:cobblestone, minecraft:stone]
    variants: [minecraft:cracked_stone_bricks, minecraft:mossy_stone_bricks, minecraft:mossy_cobblestone]
  ceiling:
    target: 3
    replace: [minecraft:stone_bricks, minecraft:cobblestone, minecraft:stone]
    variants: [minecraft:cracked_stone_bricks, minecraft:mossy_stone_bricks, minecraft:mossy_cobblestone]
  decorations: [vines, cobwebs, barrels]
  # Matěj's playtest (2026-10-24): the combination lock's six levers by trial were no fun. A lever whose block has a
  # redstone torch behind it has to be on, and stone brick stairs under it, tall half to the corridor, mark it.
  lever_hints: minecraft:stone_brick_stairs
  without:
    # No added barrels in these rooms (Matěj's review of the dressing, 2026-10-14); their own barrels stay.
    barrels:
      - dungeon/rooms/combination_lock
      - dungeon/rooms/drowned_junction
      - dungeon/rooms/husk_temple
      - dungeon/rooms/item_combination_lock
      - dungeon/rooms/lava_parkour
      - dungeon/rooms/lava_trap
      - dungeon/rooms/nether_portal
      - dungeon/rooms/stairs
      - dungeon/stairway/fall_01
      - dungeon/stairway/fall_long
      - dungeon/treasure/egg       # its exit stands where the barrels went (RLM-363)
      - dungeon/treasure/tiny_cap
      - pillager_dungeon/entrances/entrance_tower
      - pillager_dungeon/entrances/entrance_tower_2
      - pillager_dungeon/entrances/entrance_tower_2_long
      - pillager_dungeon/entrances/entrance_tower_long
      - pillager_dungeon/rooms/item_combination_lock
      - pillager_dungeon/rooms/jail
      - pillager_dungeon/rooms/jail_2
      - pillager_dungeon/rooms/jail_3
      - pillager_dungeon/rooms/library
      - pillager_dungeon/rooms/nether_portal
      - pillager_dungeon/rooms/stairs
      - pillager_dungeon/rooms/storage
      - pillager_dungeon/rooms/storage_2
      - pillager_dungeon/rooms/temple
      - pillager_dungeon/stairway/fall_01
      - pillager_dungeon/stairway/fall_long
