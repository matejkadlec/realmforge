# Import rules for DungeonZ 1.3.0+1.21.1 (MIT), A4c (RLM-120). Source and command: ../README.md.
# The rooms: the dark dungeon and the temple dungeon. Left out: their overworld entrances (a portal into DungeonZ's
# own dimension, no connector), the parkour pieces (no required parkour, research DU-23) and the pieces bigger than
# 32 blocks on an axis (whole wings of the temple).
exclude:
  - dark_dungeon_entrance.nbt
  - temple_dungeon_entrance.nbt
  - "*parkour*"
max_size: 32
blocks:
  minecraft:grass: minecraft:short_grass      # renamed in 1.20.3; the templates are from 1.19.3 and 1.20.2
  minecraft:chain: minecraft:iron_chain       # renamed in 1.21.9
  dungeonz:dungeon_spawner: minecraft:air[]   # DungeonZ's mob and boss spawner; our dungeons spawn their own (W4)
  dungeonz:dungeon_portal: minecraft:air[]    # the exit portal back to the overworld
  minecraft:structure_block: minecraft:air[]  # leftovers of the authoring world
jigsaws:
  interior: drop
  normalize: true
entities:
  keep: [minecraft:painting, minecraft:item_frame, minecraft:glow_item_frame, minecraft:armor_stand]
