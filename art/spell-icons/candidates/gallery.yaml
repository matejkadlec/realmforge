    prompt: >-
      five long sharp pale blue icicles spreading out like the ribs of an open fan from a single point in the lower left
      corner toward the upper right, white frosty tips, snow mist between them (candidates 9 to 12; 1 to 4: a wide
      fan-shaped blast of icy blue wind and snow; 5 to 8: a freezing wind blast shaped like a cone)
    pick: rd-fast-12
  ice_lance:
