# Labels, prompts and picks for `uv run rf art gallery art/spell-icons/candidates` (RLM-588, RLM-591, RLM-609,
# RLM-642). Generated on 2026-11-10 through the Retro Diffusion MCP server: rd_fast__mc_item at 16x16 for the icons,
# rd_fast__mc_texture with tiling on for the spellbook's two tiles, four candidates a request, seeds 4601 to 4633
# in the order of the subjects below. `pick` names the candidate that art/textures/ holds, cleaned.
title: Spell icons, effect icons and the spellbook's tiles
intro: >-
  Every M1 player spell's icon, the Frozen and Bleeding effect icons and the two tiles the spellbook's book texture is
  composed of. Each candidate is shown as Retro Diffusion returned it and after rf art clean snapped it to the project
  palette. The picks were made by Claude while the playtest was deferred (Matěj, 2026-11-10, ADR 0074) and are
  provisional until Matěj has reviewed this gallery, which RLM-648 owes: to change one, name the subject and the
  candidate.
candidates:
  rd-fast-1: {label: "Retro Diffusion Fast, 1", note: "0.03 USD an image, 0.12 USD a request of four"}
  rd-fast-2: {label: "Retro Diffusion Fast, 2"}
  rd-fast-3: {label: "Retro Diffusion Fast, 3"}
  rd-fast-4: {label: "Retro Diffusion Fast, 4"}
  rd-fast-5: {label: "Retro Diffusion Fast, 5", note: "second request, another prompt"}
  rd-fast-6: {label: "Retro Diffusion Fast, 6"}
  rd-fast-7: {label: "Retro Diffusion Fast, 7"}
  rd-fast-8: {label: "Retro Diffusion Fast, 8"}
  rd-fast-9: {label: "Retro Diffusion Fast, 9", note: "third request, another prompt"}
  rd-fast-10: {label: "Retro Diffusion Fast, 10"}
  rd-fast-11: {label: "Retro Diffusion Fast, 11"}
  rd-fast-12: {label: "Retro Diffusion Fast, 12"}
subjects:
  frostbolt:
