name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content:
    name: Content pipeline (validation, pytest, generated files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Validate content
        run: uv run rf validate

      - name: pytest
        run: uv run pytest

      # git_clean_worktrees.sh deletes branches and worktrees, so its safety
      # regression suite guards every change.
      - name: Worktree cleanup safety suite
        run: bash tests/test_git_clean_worktrees.sh

      - name: Generated files are up to date
        run: |
          uv run rf gen
          git diff --exit-code
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "::error::Regenerating produced files that are not committed. Run 'uv run rf gen' and commit:"
            echo "$untracked"
            exit 1
          fi

  gradle:
    name: Gradle build, JUnit, GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Build and JUnit
        run: ./gradlew build --console=plain

      - name: GameTests (headless)
        run: ./gradlew runGameTestServer --console=plain

      # Vanilla skips a broken loot table, recipe, advancement or tag with an ERROR line, so the GameTests alone
      # pass without it (architecture 6.1). `uv run rf gametest-log` fails on those lines.
      - name: GameTest log has no data loading errors
        run: |
          uv sync --locked
          uv run rf gametest-log

      - name: Upload logs and reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-logs-and-reports
          if-no-files-found: ignore
          path: |
            run/*/logs/
            run/*/crash-reports/
            **/build/reports/
            **/build/test-results/
            hs_err_pid*.log

  id-universe:
    name: Vanilla ID universe is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - uses: actions/cache@v6
        with:
          path: .cache/vanilla
          key: vanilla-server-${{ hashFiles('tools/realmforge_tools/project.py') }}

      - name: Re-extract and compare
        run: |
          uv sync --locked
          uv run rf ids vanilla
          git diff --exit-code tools/id_universe

  pack:
    name: Modpack index is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        # Pinned packwiz commit (packwiz has no tagged releases).
        run: go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e

      - name: Refresh and compare
        working-directory: pack
        run: |
          packwiz refresh
          git diff --exit-code .

  # Spike 6 (ADR 0018): the whole pack plus our jar, installed the way players and server owners install it, must
  # boot without errors. `uv run rf pack-boot` runs the same locally.
  pack-boot:
    name: Full pack boots on a dedicated server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # The pinned installers and the installed NeoForge server. The mods are installed fresh on every run, the way
      # a new server gets them.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/pack-boot/downloads
            .cache/pack-boot/server/libraries
          key: pack-boot-server-${{ hashFiles('tools/realmforge_tools/packboot.py') }}
          restore-keys: pack-boot-server-

      - name: Build the core mod jar
        run: ./gradlew :mod:jar --console=plain

      - name: Boot with and without the optional mods
        run: |
          uv sync --locked
          uv run rf pack-boot --side server

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pack-boot-server-logs
          if-no-files-found: ignore
          path: .cache/pack-boot/reports/

  pack-boot-client:
    name: Full pack boots on a client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Xvfb and Mesa (software OpenGL)
        run: |
          dpkg -s xvfb libgl1-mesa-dri > /dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          }

      # The pinned installers and the launcher's vanilla client, NeoForge, libraries and assets (about 1 GB).
      - uses: actions/cache@v6
        with:
          path: |
            .cache/pack-boot/downloads
            .cache/pack-boot/launcher
          key: pack-boot-client-${{ hashFiles('tools/realmforge_tools/packboot.py') }}
          restore-keys: pack-boot-client-

      - name: Build the core mod jar
        run: ./gradlew :mod:jar --console=plain

      - name: Boot with and without the optional mods
        run: |
          uv sync --locked
          uv run rf pack-boot --side client

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pack-boot-client-logs
          if-no-files-found: ignore
          path: .cache/pack-boot/reports/
